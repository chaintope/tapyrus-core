# Purpose: weekly checks too slow or too environment-dependent for the daily run.
#   heavy-tests: feature_pruning and feature_dbcrash, which need hours and
#     several GB of disk; one job each so they don't share the 6h job limit.
#   build-from-scratch: builds depends and Tapyrus with no caches, at the
#     minimum and at the current dependency versions in doc/dependencies.md,
#     on every native platform (with tests) and cross target (build only),
#     to prove both still build.
#   docker-testnet-sync: a node from the Docker image syncs the public testnet.
#   tor-testnet: a Tor-only node syncs the public testnet, then a Tor client,
#     an -onion node, a node with no proxy and a node reachable only through
#     Tor connect to it and each other.
#   upnp-port-mapping: -upnp maps a port on a real UPnP router (miniupnpd).
#   integration-test: tapyrus-core, tapyrus-signer and tapyrus-seeder run
#     together on a test network, defined in tapyrus-integration-tests.

name: Weekly Heavy Test

on:
  schedule:
    # Sunday 21:17 JST (12:17 UTC), so the report is ready by Monday 8 AM
    # JST even with a 6h job and the up to 3h queue delay seen on scheduled
    # runs. Not on the hour, which is when scheduled runs queue longest.
    - cron: '17 12 * * 0'
  workflow_dispatch:
    inputs:
      test_branch:
        description: 'Branch to test (default: master)'
        type: string
        default: ''
        required: false
  # Also run on any change to this workflow file itself, so edits to the
  # heavy-tests/build-from-scratch jobs are validated without waiting
  # for Sunday or triggering the full suite on unrelated pushes/PRs.
  #
  # On master only, not on pull_request: feature_pruning alone takes
  # 3h34m-4h21m, and running the whole suite on every push to a PR that happens
  # to touch this file is what put 16 multi-hour jobs into the queue twice
  # over. Validating the edit right after it merges is close enough -- a
  # mistake here delays the next Sunday run, it does not break a build.
  push:
    branches:
      - master
    paths:
      - '.github/workflows/weekly-heavy-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 'ON'
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  LC_ALL: C.UTF-8
  BOOST_TEST_RANDOM: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # apt fails fast instead of hanging on a flaky runner mirror.
  APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10

jobs:
  heavy-tests:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: feature_pruning
            script: 'feature_pruning.py'
          # Each dbcrash run loops until every node has crashed, with no time
          # limit of its own, so GitHub's 6h runner execution cap is its only
          # bound. One job per scheme, so a run that never gets there can't
          # starve the other.
          - name: feature_dbcrash
            script: 'feature_dbcrash.py'
          - name: feature_dbcrash_schnorr
            script: 'feature_dbcrash.py --scheme SCHNORR'
    name: ${{ matrix.config.name }} test (Linux x86_64 RelWithDebInfo)
    runs-on: ubuntu-latest
    # 5.5h, same as build-from-scratch: a real timeout fails legibly, while
    # GitHub-hosted runners' 6h hard cap kills the job with a lost-runner
    # style error. The 30 minutes below the cap leave room for the failure
    # log steps. feature_pruning, the slowest, has taken up to 261 min
    # including its uncached Tapyrus build.
    timeout-minutes: 330
    env:
      BASE_ROOT_DIR: ${{ github.workspace }}
      BASE_BUILD_DIR: ${{ github.workspace }}/build
      DEPENDS_DIR: ${{ github.workspace }}/depends

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.test_branch || github.ref || 'master' }}
          submodules: recursive

      # Same key as daily-test.yml's DEPENDS_HASH, so this restores the tree
      # saved by L-X86-Rel-GUI+USDT+Wallet, which builds the same depends set.
      - name: Compute depends hash
        run: echo "DEPENDS_HASH=$(git ls-files -s depends | git hash-object --stdin)" >> $GITHUB_ENV

      # Exact key only: if depends/ changed, build it from scratch.
      - name: Restore Depends cache
        id: depends-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DEPENDS_DIR }}
          key: depends-v6-qt6-linux-x86_64-${{ env.DEPENDS_HASH }}

      - name: Setup Linux dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y gcc g++ build-essential cmake ninja-build pkgconf \
            python3-zmq bsdmainutils systemtap-sdt-dev bpfcc-tools bpftrace python3-venv \
            libboost-test-dev python3-pip gperf bison
          # libxkbcommon >= 1.9.0 requires Meson >= 1.4.0; Ubuntu 24.04's apt
          # package (1.3.2) is too old, so install a current one via pip instead.
          # Pinned to an exact version (like every depends package) rather than
          # a floor, so the build tool itself doesn't float across CI runs.
          sudo pip3 install --break-system-packages --no-cache-dir "meson==1.4.0"
          python3 -m venv $HOME/venv
          source $HOME/venv/bin/activate
          pip3 install pyzmq

      - name: Build Depends
        run: |
          export HOST="x86_64-pc-linux-gnu"
          DEPENDS_PREFIX="$DEPENDS_DIR/$HOST"

          # Always run make; depends' build-id hashes make an
          # up-to-date tree a fast no-op.
          echo "Building depends for $HOST"
          make -C depends HOST=$HOST -j$(nproc) install_cmake

          echo "DEPENDS_PREFIX=$DEPENDS_PREFIX" >> $GITHUB_ENV

      - name: Enable core dumps and set test dir
        run: |
          CORE_DUMP_DIR="${{ github.workspace }}/core_dumps"
          mkdir -p "$CORE_DUMP_DIR"
          sudo sysctl -w kernel.core_pattern="$CORE_DUMP_DIR/core.%e.%p"
          TEST_DIR="${{ github.workspace }}/tapyrus_test"
          mkdir -p "$TEST_DIR"
          echo "TAPYRUS_TEST_DIR=$TEST_DIR" >> $GITHUB_ENV

      - name: Configure and build
        run: |
          HOST="x86_64-pc-linux-gnu"
          DEPENDS_PREFIX="$DEPENDS_DIR/$HOST"
          export CC="gcc"
          export CXX="g++"
          export PKG_CONFIG_PATH="$DEPENDS_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LD_LIBRARY_PATH="$DEPENDS_PREFIX/lib:$LD_LIBRARY_PATH"
          echo ">" $HOME/.tapyrus

          # No ccache: GitHub evicts cache entries unused for 7 days, the
          # same as this job's interval, so queue delays or a skipped week
          # would leave it cold anyway.
          cmake -S "$BASE_ROOT_DIR" -B "$BASE_BUILD_DIR" -GNinja \
            -DWITH_CCACHE=OFF \
            -DENABLE_ZMQ=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$DEPENDS_PREFIX" \
            -DCMAKE_TOOLCHAIN_FILE="$DEPENDS_PREFIX/toolchain.cmake" \
            -DQt6_DIR="$DEPENDS_PREFIX/lib/cmake/Qt6" \
            -DBUILD_GUI=ON \
            -DENABLE_TRACING=ON \
            -DENABLE_WALLET=ON \
            -DWITH_BDB=ON \
            -DENABLE_TESTS=ON \
            -DENABLE_BENCH=OFF \
            -DBOOST_ROOT="$DEPENDS_PREFIX" \
            -DBOOST_INCLUDEDIR="$DEPENDS_PREFIX/include" \
            -DBOOST_LIBRARYDIR="$DEPENDS_PREFIX/lib" \
            -DZEROMQ_ROOT="$DEPENDS_PREFIX" \
            -DZEROMQ_INCLUDE_DIR="$DEPENDS_PREFIX/include" \
            -DZEROMQ_LIBRARY="$DEPENDS_PREFIX/lib/libzmq.a" \
            -DBerkeleyDB_ROOT="$DEPENDS_PREFIX" \
            -DBerkeleyDB_INCLUDE_DIR="$DEPENDS_PREFIX/include" \
            -DBerkeleyDB_LIBRARY="$DEPENDS_PREFIX/lib/libdb_cxx-5.3.a"

          cmake --build "$BASE_BUILD_DIR" --parallel -j$(nproc) --target all

      - name: Run ${{ matrix.config.name }} test
        run: |
          source $HOME/venv/bin/activate
          cd "$BASE_ROOT_DIR"
          export PATH="$BASE_BUILD_DIR/bin:$PATH"
          # ulimit is per-process and does not carry over from the "Enable
          # core dumps" step (each `run:` block is a separate shell) -- it
          # must be set here, in the shell that actually execs the test
          # binaries and their children.
          ulimit -c unlimited
          echo "Disk space before test:"
          df -h .

          # These scripts are deliberately kept out of test_runner.py's
          # ALL_SCRIPTS (see HEAVY_SCRIPTS in test_runner.py) so they never run
          # as part of the daily base/extended suites -- but that also means
          # test_runner.py's positional-arg lookup (which only matches
          # ALL_SCRIPTS) can't run them by name either. Invoke the script
          # directly instead: every functional test is independently runnable
          # via its own `if __name__ == '__main__'` block and accepts
          # --tmpdir/--scheme/--configfile directly (test_framework.py's own
          # arg parser), so no orchestration layer is needed here.
          #
          # --configfile/--cachedir/--portseed mirror what test_runner.py
          # adds to every invocation automatically (test_runner.py's
          # main()/run_tests()/TestHandler). They matter beyond cosmetics:
          # test_framework.py's own --cachedir default resolves relative to
          # test_framework.py's own path (under $BASE_ROOT_DIR), whereas
          # test_runner.py overrides it to a BUILDDIR-relative path -- left
          # unset, direct invocation would silently use a different (and, for
          # feature_dbcrash's cache-based chain setup, unpopulated) cache
          # directory. --configfile happens to resolve to the same file
          # either way here, but is passed explicitly for parity.
          CONFIGFILE="$BASE_ROOT_DIR/test/config.ini"
          CACHEDIR="$BASE_BUILD_DIR/test/cache"
          rm -rf "$CACHEDIR"
          echo "---------------- Start ${{ matrix.config.script }} ----------------"
          python3 test/functional/${{ matrix.config.script }} \
            --tmpdir="$TAPYRUS_TEST_DIR/${{ matrix.config.name }}" \
            --configfile="$CONFIGFILE" \
            --cachedir="$CACHEDIR" \
            --portseed=0
          echo "Disk space after test:"
          df -h .

      # TODO: Uncomment this section once USDT tests are ready to run in CI.
      # The scripts exist in test/functional/ and are listed in USDT_SCRIPTS in test_runner.py.
      # They currently fail because the BPF scripts embedded in each test require kernel-level
      # access (CAP_BPF / root) that is not available on standard GitHub Actions runners.
      # A self-hosted runner with the right kernel capabilities is needed.
      #
      # - name: Run USDT tests
      #   run: |
      #     source $HOME/venv/bin/activate
      #     cd "$BASE_ROOT_DIR"
      #     export PATH="$BASE_BUILD_DIR/bin:$PATH"
      #     echo "---------------- Start USDT functional tests ----------------"
      #     if python3 test/functional/test_runner.py \
      #       --tmpdir="$TAPYRUS_TEST_DIR" \
      #       -j 1 \
      #       --combinedlogslen=4000 \
      #       --failfast \
      #       interface_usdt_mempool.py \
      #       interface_usdt_net.py \
      #       interface_usdt_utxocache.py; then
      #       echo "USDT tests passed"
      #     else
      #       echo "USDT tests FAILED"
      #       exit 1
      #     fi

      - name: Print full combined logs (on failure)
        # A job that times out (timeout-minutes or the 6h GitHub-hosted-runner
        # cap) can end as "cancelled" rather than "failure" -- exactly the
        # case this step exists for, so it must run on both.
        if: failure() || cancelled()
        run: |
          # Each script is invoked directly (not through test_runner.py), so
          # nothing prints combined per-node logs on its own -- do it here by
          # combining the full, untruncated logs (test framework + every
          # node's debug.log) for each test's --tmpdir directly.
          # $GITHUB_STEP_SUMMARY silently drops anything past its 1 MB
          # per-step cap, so the full output goes to a file uploaded as an
          # artifact, with only a tail in the summary.
          shopt -s nullglob
          TESTDIRS=("$TAPYRUS_TEST_DIR"/*/)
          if [ ${#TESTDIRS[@]} -eq 0 ]; then
            echo "No test directories found under $TAPYRUS_TEST_DIR"
            exit 0
          fi
          LOGDIR="${{ github.workspace }}/combined_logs"
          mkdir -p "$LOGDIR"
          echo "## Full Combined Logs — ${{ matrix.config.name }}" >> "$GITHUB_STEP_SUMMARY"
          for testdir in "${TESTDIRS[@]}"; do
            testdir="${testdir%/}"
            echo "Combining logs for $testdir"
            LOGFILE="$LOGDIR/$(basename "$testdir").log"
            python3 "$BASE_ROOT_DIR/test/functional/combine_logs.py" "$testdir" > "$LOGFILE" 2>&1
            {
              echo ""
              echo "### $(basename "$testdir") (tail; full log in the heavy-combined-logs artifact)"
              echo '```'
              tail -c 950000 "$LOGFILE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload combined logs (on failure)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: heavy-combined-logs-${{ matrix.config.name }}-${{ github.run_id }}
          path: ${{ github.workspace }}/combined_logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop dangling test processes
        if: always()
        run: |
          # A test cut off by the step timeout leaves its tapyrusd running,
          # and a running node keeps rotating its wallet's BDB log files,
          # racing the artifact zip below (sporadic ENOENT). Only the
          # on-disk data is needed, so kill the nodes before archiving.
          pkill -9 -f tapyrusd || true
          sleep 2

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: heavy-test-results-${{ matrix.config.name }}-${{ github.run_id }}
          path: ${{ github.workspace }}/tapyrus_test
          retention-days: 7
          if-no-files-found: ignore

      - name: Debug core dump (on failure)
        if: failure() || cancelled()
        run: |
          # Scan the directory configured via core_pattern in "Enable core
          # dumps and set test dir" directly -- coredumpctl (systemd-coredump's
          # own index) never sees these dumps, since core_pattern was pointed
          # at a plain file path instead of the systemd-coredump pipe.
          CORE_DUMP_DIR="${{ github.workspace }}/core_dumps"
          shopt -s nullglob
          COREFILES=("$CORE_DUMP_DIR"/core.*)
          if [ ${#COREFILES[@]} -eq 0 ]; then
            echo "No core dumps found in $CORE_DUMP_DIR"
            exit 0
          fi

          {
            echo "## Core Dump Backtraces — ${{ matrix.config.name }}"
          } >> "$GITHUB_STEP_SUMMARY"

          for COREFILE in "${COREFILES[@]}"; do
            echo "Found core dump: $COREFILE"

            # `file` embeds the crashing binary's path, but it may be relative
            # to wherever it was invoked from (e.g. "./tapyrusd" run from
            # $BASE_BUILD_DIR/bin) rather than this step's cwd ($GITHUB_WORKSPACE).
            BINARY_RAW=$(file "$COREFILE" | awk -F"'" '{print $2}')
            if [ -x "$BINARY_RAW" ]; then
              BINARY="$BINARY_RAW"
            elif [ -x "$BASE_BUILD_DIR/bin/$(basename "$BINARY_RAW" 2>/dev/null)" ]; then
              BINARY="$BASE_BUILD_DIR/bin/$(basename "$BINARY_RAW")"
            else
              echo "Could not detect crashed binary, using tapyrusd as default"
              BINARY="$BASE_BUILD_DIR/bin/tapyrusd"
            fi
            echo "Using binary: $BINARY"

            {
              echo ""
              echo "### $(basename "$COREFILE") ($BINARY)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            gdb -batch -ex "bt full" -ex "quit" "$BINARY" "$COREFILE" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload core dumps (on failure)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: heavy-core-dumps-${{ matrix.config.name }}-${{ github.run_id }}
          path: ${{ github.workspace }}/core_dumps/
          retention-days: 7

  build-from-scratch:
    name: ${{ matrix.config.name }} ${{ matrix.versions }}
    strategy:
      fail-fast: false
      matrix:
        # minimum: "Minimum tested" versions from doc/dependencies.md.
        # current: the pinned "Version" column. Daily restores depends from
        #   cache, so this catches dead download URLs and depends/Tapyrus
        #   incompatibilities.
        # Both run unit, util and functional tests. On Linux, minimum runs on
        # Ubuntu 24.04 and current on ubuntu-latest, so the oldest and newest
        # toolchains are each built against.
        versions: [minimum, current]
        # Native entries build and run the tests. Cross entries build only:
        # their binaries can't run on the Linux runner, and daily's cross jobs
        # never rebuild depends from scratch, so this is where cross toolchain
        # or download drift shows up.
        config:
          - name: Linux x86_64 native
            os: ubuntu-latest
            os_minimum: ubuntu-24.04
            platform: linux
            host: x86_64-pc-linux-gnu
          - name: Linux arm64 native
            os: ubuntu-26.04-arm
            os_minimum: ubuntu-24.04-arm
            platform: linux
            host: aarch64-linux-gnu
          - name: macOS arm64 native
            os: macos-latest
            os_minimum: macos-latest
            platform: macos
            host: arm64-apple-darwin
          - name: macOS x86_64 cross
            os: ubuntu-latest
            os_minimum: ubuntu-24.04
            platform: linux
            target_platform: macos
            target_arch: x86_64
            host: x86_64-apple-darwin
          - name: macOS arm64 cross
            os: ubuntu-latest
            os_minimum: ubuntu-24.04
            platform: linux
            target_platform: macos
            target_arch: arm64
            host: arm64-apple-darwin
          - name: Windows x86_64 cross
            os: ubuntu-latest
            os_minimum: ubuntu-24.04
            platform: linux
            target_platform: windows
            target_arch: x86_64
            host: x86_64-w64-mingw32
        # Minimum versions with the newest compiler. One entry only, because
        # each is another job of up to 5.5h.
        include:
          - versions: minimum
            config:
              name: Linux x86_64 native newest compiler
              os: ubuntu-latest
              os_minimum: ubuntu-latest
              platform: linux
              host: x86_64-pc-linux-gnu
    # A lookup, so an entry without the key gets no runner and fails instead of
    # silently using the other variant's.
    runs-on: ${{ matrix.config[matrix.versions == 'minimum' && 'os_minimum' || 'os'] }}
    # 5.5h, leaving 30 minutes of margin below GitHub-hosted runners' 6h hard
    # cap: this job's from-scratch depends build (no cache, deliberately) plus
    # full GUI+wallet build plus unit/util/functional tests has no prior
    # baseline run to size against, unlike daily-test.yml's cached-depends
    # jobs. A real timeout here fails legibly instead of GitHub silently
    # killing the job at 6h with a less informative error.
    timeout-minutes: 330
    # Builds depends and Tapyrus from scratch with no caches (no depends
    # cache, no ccache), to prove doc/dependencies.md's versions still build.
    # If the minimum variant fails, raise that package's "Minimum tested" in
    # doc/dependencies.md rather than relaxing this job.
    env:
      BASE_ROOT_DIR: ${{ github.workspace }}
      BASE_BUILD_DIR: ${{ github.workspace }}/build
      DEPENDS_DIR: ${{ github.workspace }}/depends
      HOST: ${{ matrix.config.host }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.test_branch || github.ref || 'master' }}
          submodules: recursive

      - name: Setup Linux dependencies
        timeout-minutes: 10
        if: matrix.config.platform == 'linux'
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y gcc g++ build-essential cmake ninja-build pkgconf \
            python3-zmq bsdmainutils systemtap-sdt-dev bpfcc-tools bpftrace python3-venv \
            libboost-test-dev python3-pip gperf bison
          # libxkbcommon >= 1.9.0 requires Meson >= 1.4.0; Ubuntu's apt package
          # is too old on both x86_64 and arm64 runners, so install a current
          # one via pip instead. Pinned to an exact version, matching the
          # heavy-tests job above and #452's reasoning: a floating build tool
          # works against CI stability.
          sudo pip3 install --break-system-packages --no-cache-dir "meson==1.4.0"
          python3 -m venv $HOME/venv
          source $HOME/venv/bin/activate
          pip3 install pyzmq

      - name: Setup macOS cross-compilation dependencies
        timeout-minutes: 15
        if: matrix.config.target_platform == 'macos'
        run: |
          sudo apt-get $APT_OPTS install -y curl clang lld llvm llvm-dev
          # Downloaded fresh every run, so a dead SDK link fails here.
          XCODE_VERSION=$(grep '^XCODE_VERSION=' depends/hosts/darwin.mk | cut -d= -f2)
          XCODE_BUILD_ID=$(grep '^XCODE_BUILD_ID=' depends/hosts/darwin.mk | cut -d= -f2)
          OSX_SDK_FILENAME="Xcode-${XCODE_VERSION}-${XCODE_BUILD_ID}-extracted-SDK-with-libcxx-headers.tar.gz"
          mkdir -p depends/SDKs depends/sdk-sources
          curl --location --fail "https://bitcoincore.org/depends-sources/sdks/${OSX_SDK_FILENAME}" \
            -o "depends/sdk-sources/${OSX_SDK_FILENAME}" \
            || curl --location --fail "https://s3.ap-northeast-1.amazonaws.com/repo.tapyrus.chaintope.com/${OSX_SDK_FILENAME}" \
              -o "depends/sdk-sources/${OSX_SDK_FILENAME}"
          tar -C depends/SDKs -xf "depends/sdk-sources/${OSX_SDK_FILENAME}"

      - name: Setup Windows cross-compilation dependencies
        timeout-minutes: 10
        if: matrix.config.target_platform == 'windows'
        run: |
          sudo apt-get $APT_OPTS install -y g++-mingw-w64-x86-64 mingw-w64-x86-64-dev binutils-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Setup macOS dependencies
        timeout-minutes: 15
        if: matrix.config.platform == 'macos'
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew install --quiet coreutils ninja pkgconf gnu-getopt boost gperf
          brew install --quiet meson || brew upgrade meson
          python3 -m venv $HOME/venv
          source $HOME/venv/bin/activate
          pip3 install pyzmq matplotlib

      - name: Patch depends/packages/*.mk to the documented minimum versions
        # minimum variant only.
        if: matrix.versions == 'minimum'
        # Swaps each of the 5 packages doc/dependencies.md documents a
        # "Minimum required" for below their currently-pinned "Version":
        # Boost, Expat, FreeType, libevent, and systemtap. All five were
        # bumped in the same change that introduced this job, and in every
        # case "Minimum required" is the version they were bumped *from* --
        # not necessarily the absolute floor CMakeLists.txt's find_package()
        # would technically accept (cmake/module/AddBoostIfNeeded.cmake:85
        # still says `find_package(Boost 1.73.0 REQUIRED)` and
        # CMakeLists.txt:366 still says `find_package(Libevent 2.1.8 MODULE
        # REQUIRED)`, both older than what's swapped in here -- those C++-side
        # floors are untouched; this job proves a narrower, actually-tested
        # guarantee, not the CMake-permitted extreme). See doc/dependencies.md
        # ("Minimum tested") for the full reasoning.
        #
        # The rest of depends/packages/*.mk is left pinned at its current
        # version:
        #   - Berkeley DB: find_package(BerkeleyDB 4.8...5.99 MODULE REQUIRED)
        #     (CMakeLists.txt:149) is already satisfied by the 5.3.28 pinned
        #     in bdb.mk, and doc/dependencies.md documents no separate
        #     "Minimum required" for it (Version and Minimum required are
        #     both 5.3.28), so bdb.mk is left as-is.
        #   - Qt: find_package(Qt 6.0 ...) (CMakeLists.txt:180) is 5+ minor
        #     versions behind the 6.10.1 pinned in qt.mk. Swapping in Qt 6.0.0
        #     isn't a one-line version+hash change the way the five above
        #     are -- Qt's own depends recipe (qt.mk, qt_details.mk, its
        #     bundled patches) was written against the currently-pinned Qt
        #     series and isn't verified compatible with a 6.0.0 source tree,
        #     so it's left pinned at the current version here rather than
        #     risk a confusing, Qt-specific breakage in this job. Actually
        #     testing the Qt 6.0 floor needs its own dedicated follow-up.
        #   - fontconfig, libXau, libxkbcommon: also bumped alongside the
        #     five above, but their older releases used a different archive
        #     format or download host than the currently-pinned .mk recipe
        #     (fontconfig/libXau: .tar.bz2 instead of today's .tar.xz/.tar.gz;
        #     libxkbcommon: xkbcommon.org instead of today's GitHub-tags
        #     fetch) -- swapping them needs real per-field changes here, not
        #     a plain version+hash substitution, so left untested below
        #     "Version" for now rather than adding that complexity.
        #
        # depends/packages/*.mk hardcodes each package's sha256_hash tied to
        # the currently-pinned version's own tarball -- overriding just the
        # version would fail depends' own integrity check against the wrong
        # hash. All five targets below are fixed historical releases whose
        # tarballs (and therefore hashes) never change, so the hashes are
        # pre-computed constants, copied from this same commit's own
        # depends/packages/*.mk before it bumped them -- already verified by
        # every prior build that ran with that version pinned, not something
        # derived from the file being checked the way a trust-on-first-use
        # runtime download would be.
        #
        # Portable across GNU (Linux) and BSD (macOS) userland deliberately:
        # sed -i.bak + rm (not bare sed -i, which needs a backup-suffix
        # argument on BSD sed but not GNU sed -- ".bak" works identically on
        # both).
        run: |
          set -euo pipefail

          patch_min_version() {
            local mk_file="$1" min_version="$2" hash="$3"
            sed -i.bak \
              -e "s/^\$(package)_version=.*/\$(package)_version=$min_version/" \
              -e "s/^\$(package)_sha256_hash=.*/\$(package)_sha256_hash=$hash/" \
              "$mk_file"
            rm -f "$mk_file.bak"
            echo "---- $mk_file after patching ----"
            cat "$mk_file"
          }

          # Boost 1.81.0 -- the version this PR bumped boost.mk from (now 1.92.0).
          patch_min_version depends/packages/boost.mk 1.81.0 \
            205666dea9f6a7cfed87c7a6dfbeb52a2c1b9de55712c9c1a87735d7181452b6

          # Expat 2.4.8 -- the version this PR's predecessor bumped expat.mk
          # from (now 2.8.3). download_path/file_name pattern is unchanged
          # across that bump, so a plain version+hash swap is safe.
          patch_min_version depends/packages/expat.mk 2.4.8 \
            f79b8f904b749e3e0d20afeadecf8249c55b2e32d4ebb089ae378df479dcaf25

          # FreeType 2.11.0 -- the version this PR bumped freetype.mk from
          # (now 2.14.3).
          patch_min_version depends/packages/freetype.mk 2.11.0 \
            8bee39bd3968c4804b70614a0a3ad597299ad0e824bc8aad5ce8aaf48067bde7

          # libevent 2.1.12-stable -- the version this PR bumped libevent.mk
          # from (now 2.1.13-stable). libevent.mk's cmake_fixups.patch/
          # winver_fixup.patch are version-guarded (ifeq ($(package)_version),
          # 2.1.12-stable) -- swapping the version here makes that guard match
          # again and correctly re-applies them, instead of the old failure
          # mode where a version-only swap left 2.1.13-era-unrelated patches
          # forced onto whatever tarball got fetched.
          patch_min_version depends/packages/libevent.mk 2.1.12-stable \
            92e6de1be9ec176428fd2367677e61ceffc2ee1cb119035037a27d346b0403bb

          # systemtap 4.7 -- the version this PR's predecessor bumped
          # systemtap.mk from (now 5.5). remove_SDT_ASM_SECTION_AUTOGROUP_
          # SUPPORT_check.patch is version-guarded for both 4.7 and 5.5 (same
          # patch content, unchanged across that bump), so this swap also
          # correctly re-applies it.
          patch_min_version depends/packages/systemtap.mk 4.7 \
            43a0a3db91aa4d41e28015b39a65e62059551f3cc7377ebf3a3a5ca7339e7b1f

      - name: Build Depends (from scratch, no cache)
        run: |
          echo "Building depends for $HOST (from scratch, no cache restore)"
          if [ "${{ matrix.config.platform }}" == "macos" ]; then
            CPU_COUNT=$(sysctl -n hw.ncpu)
          else
            CPU_COUNT=$(nproc)
          fi
          make -C depends HOST=$HOST -j$CPU_COUNT install_cmake
          echo "DEPENDS_PREFIX=$DEPENDS_DIR/$HOST" >> $GITHUB_ENV

      - name: Print built dependency versions
        # Shows the versions actually built, e.g. that the minimum patch took
        # effect.
        run: |
          echo "== depends/built/$HOST: actually-built artifact versions =="
          for f in depends/built/"$HOST"/*/*.tar.gz; do
            [ -e "$f" ] || continue
            basename "$f" | sed -E 's/-[0-9a-f]{11}\.tar\.gz$//'
          done | sort

      - name: Enable core dumps and set test dir
        if: ${{ !matrix.config.target_platform }}
        run: |
          CORE_DUMP_DIR="${{ github.workspace }}/core_dumps"
          mkdir -p "$CORE_DUMP_DIR"
          if [ "${{ matrix.config.platform }}" == "linux" ]; then
            sudo sysctl -w kernel.core_pattern="$CORE_DUMP_DIR/core.%e.%p"
          else
            sudo sysctl -w kern.corefile="$CORE_DUMP_DIR/core.%N"
          fi
          TEST_DIR="${{ github.workspace }}/tapyrus_test"
          mkdir -p "$TEST_DIR"
          echo "TAPYRUS_TEST_DIR=$TEST_DIR" >> $GITHUB_ENV

      - name: Configure and build (GUI + wallet enabled)
        run: |
          if [ "${{ matrix.config.platform }}" == "macos" ] || [ "${{ matrix.config.target_platform }}" == "macos" ]; then
            export CC="clang"
            export CXX="clang++"
          else
            export CC="gcc"
            export CXX="g++"
          fi
          if [ "${{ matrix.config.platform }}" == "macos" ]; then
            CPU_COUNT=$(sysctl -n hw.ncpu)
          else
            CPU_COUNT=$(nproc)
          fi
          export PKG_CONFIG_PATH="$DEPENDS_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LD_LIBRARY_PATH="$DEPENDS_PREFIX/lib:$LD_LIBRARY_PATH"
          echo ">" $HOME/.tapyrus

          CMAKE_OPTS=(
            -DENABLE_ZMQ=ON
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
            -DCMAKE_PREFIX_PATH="$DEPENDS_PREFIX"
            -DCMAKE_TOOLCHAIN_FILE="$DEPENDS_PREFIX/toolchain.cmake"
            -DQt6_DIR="$DEPENDS_PREFIX/lib/cmake/Qt6"
            -DBUILD_GUI=ON
            -DENABLE_WALLET=ON
            -DWITH_BDB=ON
            -DENABLE_BENCH=OFF
            -DWITH_CCACHE=OFF
            -DBOOST_ROOT="$DEPENDS_PREFIX"
            -DBOOST_INCLUDEDIR="$DEPENDS_PREFIX/include"
            -DBOOST_LIBRARYDIR="$DEPENDS_PREFIX/lib"
            -DZEROMQ_ROOT="$DEPENDS_PREFIX"
            -DZEROMQ_INCLUDE_DIR="$DEPENDS_PREFIX/include"
            -DZEROMQ_LIBRARY="$DEPENDS_PREFIX/lib/libzmq.a"
            -DBerkeleyDB_ROOT="$DEPENDS_PREFIX"
            -DBerkeleyDB_INCLUDE_DIR="$DEPENDS_PREFIX/include"
            -DBerkeleyDB_LIBRARY="$DEPENDS_PREFIX/lib/libdb_cxx-5.3.a"
          )
          if [ "${{ matrix.config.target_platform }}" == "macos" ]; then
            OSX_MIN_VERSION=$(grep '^OSX_MIN_VERSION=' depends/hosts/darwin.mk | cut -d= -f2)
            CMAKE_OPTS+=(-DENABLE_TESTS=OFF -DBUILD_UTILS=ON -DENABLE_TRACING=OFF -DWARN_INCOMPATIBLE_BDB=OFF
              -DCMAKE_SYSTEM_NAME=Darwin
              -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.config.target_arch }}
              -DCMAKE_OSX_ARCHITECTURES=${{ matrix.config.target_arch }}
              -DCMAKE_OSX_DEPLOYMENT_TARGET=$OSX_MIN_VERSION)
          elif [ "${{ matrix.config.target_platform }}" == "windows" ]; then
            CMAKE_OPTS+=(-DENABLE_TESTS=OFF -DBUILD_UTILS=ON -DENABLE_TRACING=OFF)
          elif [ "${{ matrix.config.platform }}" == "linux" ]; then
            CMAKE_OPTS+=(-DENABLE_TESTS=ON -DENABLE_TRACING=ON)
          else
            # USDT/systemtap tracing is Linux-only.
            CMAKE_OPTS+=(-DENABLE_TESTS=ON -DENABLE_TRACING=OFF -DWARN_INCOMPATIBLE_BDB=OFF)
          fi

          cmake -S "$BASE_ROOT_DIR" -B "$BASE_BUILD_DIR" -GNinja "${CMAKE_OPTS[@]}"
          cmake --build "$BASE_BUILD_DIR" --parallel -j$CPU_COUNT --target all

      - name: Run unit tests
        if: ${{ !matrix.config.target_platform }}
        run: |
          ulimit -c unlimited
          cd "$BASE_BUILD_DIR/bin"
          ./test_tapyrus --log_level=test_suite --report_level=short --build_info --catch_system_errors

      - name: Run util tests
        if: ${{ !matrix.config.target_platform }}
        run: |
          cd "$BASE_ROOT_DIR"
          python3 test/util/tapyrus-util-test.py

      - name: Run functional tests
        if: ${{ !matrix.config.target_platform }}
        run: |
          source $HOME/venv/bin/activate
          cd "$BASE_ROOT_DIR"
          export PATH="$BASE_BUILD_DIR/bin:$PATH"
          ulimit -c unlimited
          python3 test/functional/test_runner.py --tmpdir="$TAPYRUS_TEST_DIR" -j 1 --combinedlogslen=4000 --quiet

      - name: Stop dangling test processes
        if: failure() || cancelled()
        run: |
          # A tapyrusd left running keeps writing to its datadir while the
          # upload below zips it, so stop any before archiving.
          pkill -9 -f tapyrusd || true
          sleep 2

      - name: Upload test results (on failure)
        # Holds only the failed tests' directories (passing tests remove
        # theirs), each with the combined.log test_runner.py writes.
        if: (failure() || cancelled()) && !matrix.config.target_platform
        uses: actions/upload-artifact@v6
        with:
          name: build-from-scratch-${{ matrix.versions }}-test-results-${{ matrix.config.name }}-${{ github.run_id }}
          path: ${{ github.workspace }}/tapyrus_test
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload core dumps (on failure)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: build-from-scratch-${{ matrix.versions }}-core-dumps-${{ matrix.config.name }}-${{ github.run_id }}
          path: ${{ github.workspace }}/core_dumps/
          retention-days: 7

  docker-testnet-sync:
    name: Docker testnet sync (single node)
    runs-on: ubuntu-latest
    # A fresh node synced against master in ~30 minutes, so the first check
    # waits 30 minutes, then polls every 10 minutes until sync completes, up
    # to a 2 hour max budget - a generous 4x margin over the known baseline.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.test_branch || github.ref || 'master' }}
          submodules: recursive

      - name: Build tapyrusd Docker image
        run: docker build -t tapyrusd:weekly-testnet-sync .

      - name: Start node connected to the public testnet
        # Config/genesis block per doc/tapyrus/getting_started.md
        # ("How to start a node on Tapyrus testnet?") and doc/docker_image.md.
        # Testnet is network ID 1939510133, tapyrus "prod" mode (see
        # doc/tapyrus/network_id_and_magic_bytes.md) - not a separate build mode.
        # The genesis hex itself lives in contrib/docker/testnet-genesis-block-with-sig
        # (single source of truth - must match the testnet example in
        # doc/tapyrus/getting_started.md if that's ever regenerated).
        run: |
          cat << 'EOS' > tapyrus.conf
          networkid=1939510133
          txindex=1
          server=1
          rest=1
          rpcuser=rpcuser
          rpcpassword=rpcpassword
          rpcbind=0.0.0.0
          rpcallowip=127.0.0.1
          addseeder=static-seed.tapyrus.dev.chaintope.com
          EOS

          docker run -d --name tapyrus_testnet_sync \
            -v "$PWD/tapyrus.conf:/etc/tapyrus/tapyrus.conf" \
            -e GENESIS_BLOCK_WITH_SIG="$(cat contrib/docker/testnet-genesis-block-with-sig)" \
            tapyrusd:weekly-testnet-sync

          sleep 30
          if ! docker ps --format '{{.Names}}' | grep -q '^tapyrus_testnet_sync$'; then
            docker logs tapyrus_testnet_sync
            echo "FAILED: container exited within 30 seconds of startup"
            exit 1
          fi

      - name: Wait for testnet sync to complete
        run: |
          cli() { docker exec tapyrus_testnet_sync tapyrus-cli -conf=/etc/tapyrus/tapyrus.conf "$@"; }
          # jq (preinstalled on ubuntu-latest) avoids coupling this health check to
          # tapyrus-cli's pretty-printed JSON spacing (`"initialblockdownload": false`),
          # which is a format assumption rather than a guaranteed API contract.
          ibd_complete() { [ "$(cli getblockchaininfo | jq -r .initialblockdownload)" = "false" ]; }

          echo "Waiting 30 minutes for peer discovery and initial sync..."
          sleep 1800
          # RPC calls return an empty string (not an error) if the container/tapyrusd
          # isn't reachable yet; without the fallback, `[ "" -lt 1 ]` aborts the step
          # with a bash "integer expression expected" error instead of FAILED: ...
          connections=$(cli getconnectioncount 2>/dev/null || echo 0)
          height_prev=$(cli getblockcount 2>/dev/null || echo 0)
          echo "After 30 min: height=$height_prev connections=$connections"

          if [ "$connections" -lt 1 ]; then
            echo "FAILED: node made no peer connections to the testnet"
            exit 1
          fi

          if ibd_complete; then
            echo "Node completed initial block download within 30 minutes."
            exit 0
          fi

          # Poll every 10 minutes until sync completes, up to a 2 hour total
          # budget (30 min + 9 * 10 min).
          for checkpoint in $(seq 1 9); do
            elapsed=$((30 + (checkpoint - 1) * 10))
            echo "Checkpoint $checkpoint/9 (elapsed ${elapsed}m): waiting 10 minutes..."
            sleep 600
            height_now=$(cli getblockcount 2>/dev/null || echo 0)
            connections=$(cli getconnectioncount 2>/dev/null || echo 0)
            echo "Checkpoint $checkpoint: height=$height_now connections=$connections"

            if [ "$connections" -lt 1 ]; then
              echo "FAILED: lost all peer connections at checkpoint $checkpoint"
              exit 1
            fi

            if ibd_complete; then
              echo "Node completed initial block download."
              exit 0
            fi

            if [ "$height_now" -le "$height_prev" ]; then
              echo "FAILED: no sync progress since last checkpoint ($height_prev -> $height_now)"
              exit 1
            fi

            height_prev=$height_now
          done

          echo "FAILED: sync did not complete within the 2 hour max time"
          exit 1

      - name: Dump node debug.log
        if: always()
        run: docker exec tapyrus_testnet_sync cat /var/lib/tapyrus/debug.log || true

      - name: Stop and remove container
        if: always()
        run: docker rm -f tapyrus_testnet_sync || true

  tor-testnet:
    name: Tor nodes on the public testnet
    runs-on: ubuntu-latest
    # Syncing through Tor exit relays is slower than docker-testnet-sync's
    # ~30 minutes direct, so the sync gets up to 4 hours. The rest of the job
    # (image build, Tor bootstrap, onion connections) takes about 30 minutes.
    timeout-minutes: 300
    env:
      TESTNET_SEED: static-seed.tapyrus.dev.chaintope.com
    # Five nodes on three Tor daemons. Each node shares the network namespace
    # of a Tor container, so 127.0.0.1:9050 (SOCKS) and 127.0.0.1:9051
    # (control) are local to it, as on a single host:
    #   node1 (tor1): -proxy for all outbound, only an onion bind for inbound.
    #   node2 (tor2): the plain Tor client, -proxy with listen=0.
    #   node3 (tor1): no proxy, a clearnet and an onion bind. Dials node1's
    #     onion bind on loopback.
    #   node4 (tor4): -onion for .onion peers, a clearnet and an onion bind.
    #     Dials the onion services of node1, node3 and node5, and one testnet peer.
    #   node5 (tor2): reachable only through Tor. listenonion=0 and an onion
    #     service set up in tor2's torrc, forwarding to node5's onion bind.
    #     No proxy and no outbound peers.
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.test_branch || github.ref || 'master' }}
          submodules: recursive

      - name: Build tapyrusd Docker image
        run: docker build -t tapyrusd:weekly-tor .

      - name: Start the Tor daemons
        run: |
          # A fresh control password per run; tapyrusd reads it from its conf.
          TOR_PW=$(openssl rand -hex 16)
          echo "::add-mask::$TOR_PW"
          echo "TOR_PW=$TOR_PW" >> "$GITHUB_ENV"
          docker network create tor-test-net
          for t in tor1 tor2 tor4; do
            # node5's onion service, set up by hand rather than by tapyrusd.
            hidden_service=""
            [ "$t" = tor2 ] && hidden_service='HiddenServiceDir /root/hs\nHiddenServicePort 2357 127.0.0.1:2358\n'
            docker run -d --name "$t" --network tor-test-net -e TOR_PW="$TOR_PW" -e HIDDEN_SERVICE="$hidden_service" ubuntu:24.04 bash -c '
              apt-get update -qq &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tor iproute2 > /dev/null &&
              hash=$(tor --quiet --hash-password "$TOR_PW" | tail -n 1) &&
              printf "SocksPort 127.0.0.1:9050\nControlPort 127.0.0.1:9051\nHashedControlPassword %s\nDataDirectory /root/tor-data\nLog notice stdout\n%b" "$hash" "$HIDDEN_SERVICE" > /root/torrc &&
              exec tor -f /root/torrc'
          done
          for t in tor1 tor2 tor4; do
            deadline=$((SECONDS + 600))
            until docker logs "$t" 2>&1 | grep -q "Bootstrapped 100%"; do
              if [ "$(docker inspect -f '{{.State.Running}}' "$t")" != "true" ] || [ "$SECONDS" -ge "$deadline" ]; then
                docker logs "$t" 2>&1 | tail -50
                echo "FAILED: $t did not bootstrap within 10 minutes"
                exit 1
              fi
              sleep 5
            done
            echo "$t bootstrapped"
          done
          node5_onion=$(docker exec tor2 cat /root/hs/hostname) || { echo "FAILED: tor2 created no onion service for node5"; exit 1; }
          echo "node5 onion service: $node5_onion:2357"
          echo "NODE5_ONION=$node5_onion:2357" >> "$GITHUB_ENV"

      - name: Start node1 (Tor only)
        run: |
          mkdir -p tor_test
          # Testnet: network ID 1939510133, prod mode, as in docker-testnet-sync.
          cat << EOS > tor_test/node1.conf
          networkid=1939510133
          server=1
          rpcuser=rpcuser
          rpcpassword=rpcpassword
          rpcallowip=127.0.0.1
          debug=net
          debug=tor
          listen=1
          proxy=127.0.0.1:9050
          bind=127.0.0.1:2358=onion
          listenonion=1
          torcontrol=127.0.0.1:9051
          torpassword=$TOR_PW
          addseeder=$TESTNET_SEED
          EOS
          docker run -d --name node1 --network container:tor1 \
            -v "$PWD/tor_test/node1.conf:/etc/tapyrus/tapyrus.conf" \
            -e GENESIS_BLOCK_WITH_SIG="$(cat contrib/docker/testnet-genesis-block-with-sig)" \
            tapyrusd:weekly-tor

          # No node advertises its v3 onion address, so read it from the log.
          deadline=$((SECONDS + 600))
          until onion=$(docker exec node1 sh -c 'cat /var/lib/tapyrus/*/debug.log' 2>/dev/null \
                        | sed -n 's/.*tor: Got service ID [a-z2-7]*, onion service \([a-z2-7]*\.onion:[0-9]*\).*/\1/p' | tail -n 1) && [ -n "$onion" ]; do
            if [ "$(docker inspect -f '{{.State.Running}}' node1)" != "true" ] || [ "$SECONDS" -ge "$deadline" ]; then
              echo "FAILED: node1 got no onion service from Tor within 10 minutes"
              exit 1
            fi
            sleep 5
          done
          echo "node1 onion service: $onion"
          echo "NODE1_ONION=$onion" >> "$GITHUB_ENV"

      - name: Wait for node1 to sync the testnet through Tor
        run: |
          cli() { docker exec node1 tapyrus-cli -conf=/etc/tapyrus/tapyrus.conf "$@"; }
          ibd_complete() { [ "$(cli getblockchaininfo | jq -r .initialblockdownload)" = "false" ]; }

          # Poll every 10 minutes, failing on no progress, up to 4 hours.
          height_prev=-1
          for checkpoint in $(seq 1 24); do
            sleep 600
            height_now=$(cli getblockcount 2>/dev/null || echo 0)
            connections=$(cli getconnectioncount 2>/dev/null || echo 0)
            echo "Checkpoint $checkpoint (elapsed $((checkpoint * 10))m): height=$height_now connections=$connections"
            if ibd_complete; then
              echo "node1 completed initial block download through Tor."
              exit 0
            fi
            if [ "$connections" -lt 1 ]; then
              echo "FAILED: node1 has no peers at checkpoint $checkpoint"
              exit 1
            fi
            if [ "$height_now" -le "$height_prev" ]; then
              echo "FAILED: no sync progress since the last checkpoint ($height_prev -> $height_now)"
              exit 1
            fi
            height_prev=$height_now
          done
          echo "FAILED: node1 did not sync within 4 hours"
          exit 1

      - name: Start node2 (Tor client), node3 (no proxy) and node5 (behind Tor)
        run: |
          # -connect, so each node has only the outbound peers checked below.
          cat << EOS > tor_test/node2.conf
          networkid=1939510133
          server=1
          rpcuser=rpcuser
          rpcpassword=rpcpassword
          rpcallowip=127.0.0.1
          debug=net
          listen=0
          proxy=127.0.0.1:9050
          connect=$TESTNET_SEED
          EOS
          # node3 shares tor1's namespace with node1, so its ports are shifted by 10.
          cat << EOS > tor_test/node3.conf
          networkid=1939510133
          server=1
          rpcuser=rpcuser
          rpcpassword=rpcpassword
          rpcallowip=127.0.0.1
          rpcport=2387
          debug=net
          debug=tor
          listen=1
          port=2367
          bind=0.0.0.0:2367
          bind=127.0.0.1:2368=onion
          listenonion=1
          torcontrol=127.0.0.1:9051
          torpassword=$TOR_PW
          connect=127.0.0.1:2358
          EOS
          # node5 shares tor2's namespace with node2, so its RPC port is shifted by 10.
          # tor2's torrc forwards node5's onion service to its onion bind.
          cat << EOS > tor_test/node5.conf
          networkid=1939510133
          server=1
          rpcuser=rpcuser
          rpcpassword=rpcpassword
          rpcallowip=127.0.0.1
          rpcport=2387
          debug=net
          listen=1
          bind=127.0.0.1:2358=onion
          listenonion=0
          connect=0
          EOS
          for n in 2 3 5; do
            case $n in 3) tor=tor1 ;; *) tor=tor2 ;; esac
            docker run -d --name "node$n" --network "container:$tor" \
              -v "$PWD/tor_test/node$n.conf:/etc/tapyrus/tapyrus.conf" \
              -e GENESIS_BLOCK_WITH_SIG="$(cat contrib/docker/testnet-genesis-block-with-sig)" \
              tapyrusd:weekly-tor
          done

          deadline=$((SECONDS + 600))
          until onion=$(docker exec node3 sh -c 'cat /var/lib/tapyrus/*/debug.log' 2>/dev/null \
                        | sed -n 's/.*tor: Got service ID [a-z2-7]*, onion service \([a-z2-7]*\.onion:[0-9]*\).*/\1/p' | tail -n 1) && [ -n "$onion" ]; do
            if [ "$(docker inspect -f '{{.State.Running}}' node3)" != "true" ] || [ "$SECONDS" -ge "$deadline" ]; then
              echo "FAILED: node3 got no onion service from Tor within 10 minutes"
              exit 1
            fi
            sleep 5
          done
          echo "node3 onion service: $onion"
          echo "NODE3_ONION=$onion" >> "$GITHUB_ENV"

      - name: Start node4 (-onion, clearnet and onion bind)
        run: |
          cat << EOS > tor_test/node4.conf
          networkid=1939510133
          server=1
          rpcuser=rpcuser
          rpcpassword=rpcpassword
          rpcallowip=127.0.0.1
          debug=net
          debug=tor
          listen=1
          bind=0.0.0.0
          bind=127.0.0.1:2358=onion
          onion=127.0.0.1:9050
          listenonion=1
          torcontrol=127.0.0.1:9051
          torpassword=$TOR_PW
          connect=$NODE1_ONION
          connect=$NODE3_ONION
          connect=$NODE5_ONION
          connect=$TESTNET_SEED
          EOS
          docker run -d --name node4 --network container:tor4 \
            -v "$PWD/tor_test/node4.conf:/etc/tapyrus/tapyrus.conf" \
            -e GENESIS_BLOCK_WITH_SIG="$(cat contrib/docker/testnet-genesis-block-with-sig)" \
            tapyrusd:weekly-tor

      - name: Check the peers and that onion traffic goes through Tor
        run: |
          cli() { docker exec "$1" tapyrus-cli -conf=/etc/tapyrus/tapyrus.conf "${@:2}"; }
          # Peers that finished the version handshake.
          peers() { cli "$1" getpeerinfo | jq '[.[] | select(.version > 0)]'; }
          count() { peers "$1" | jq "[.[] | select($2)] | length"; }
          debug_log() { docker exec "$1" sh -c 'cat /var/lib/tapyrus/*/debug.log'; }
          # TCP sockets in a Tor container's network namespace.
          sockets() { docker exec "$1" ss -Htn state established; }
          listeners() { docker exec "$1" ss -Hltn; }

          # node1's and node5's onion services were published during node1's sync,
          # and node4 starts after node3's, so this waits for Tor circuits and
          # node3's new descriptor, normally a minute or two.
          deadline=$((SECONDS + 300))
          until [ "$(count node2 "(.inbound | not) and (.addr | startswith(\"$TESTNET_SEED\"))")" -ge 1 ] \
             && [ "$(count node3 '(.inbound | not) and .addr == "127.0.0.1:2358"')" -ge 1 ] \
             && [ "$(count node4 "(.inbound | not) and .addr == \"$NODE1_ONION\"")" -ge 1 ] \
             && [ "$(count node4 "(.inbound | not) and .addr == \"$NODE3_ONION\"")" -ge 1 ] \
             && [ "$(count node4 "(.inbound | not) and .addr == \"$NODE5_ONION\"")" -ge 1 ] \
             && [ "$(count node4 "(.inbound | not) and (.addr | startswith(\"$TESTNET_SEED\"))")" -ge 1 ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              for n in 2 3 4; do echo "== node$n peers =="; peers "node$n"; done
              echo "FAILED: node2, node3 and node4 did not connect to their peers within 5 minutes"
              exit 1
            fi
            sleep 15
          done
          for n in 1 2 3 4 5; do echo "== node$n peers =="; peers "node$n"; done
          for t in tor1 tor2 tor4; do echo "== $t namespace sockets =="; sockets "$t"; listeners "$t"; done

          fail() { echo "FAILED: $*"; exit 1; }
          via_socks() { [ "$(sockets "$1" | awk '$4 == "127.0.0.1:9050"' | wc -l)" -ge 1 ]; }

          # node1 and node2: every outbound peer goes through the SOCKS port, and
          # nothing in their namespaces dials a P2P port directly.
          for n in 1 2; do
            [ "$(count "node$n" '(.inbound | not) and (.addrbind | startswith("127.0.0.1:") | not)')" -eq 0 ] \
              || fail "node$n has an outbound peer that does not go through the Tor SOCKS proxy"
          done
          via_socks tor1 || fail "node1 has no connection to its Tor SOCKS port"
          via_socks tor2 || fail "node2 has no connection to its Tor SOCKS port"
          for t in tor1 tor2; do
            [ "$(sockets "$t" | awk '$4 ~ /:2357$/ && $4 !~ /^127\.0\.0\.1:/' | wc -l)" -eq 0 ] \
              || fail "a node in $t's namespace connects to a P2P port directly, not through Tor"
          done

          # node1: node3 (directly) and node4 (through Tor) arrive on the onion bind,
          # and -whitelist never applies to them.
          [ "$(count node1 '.inbound and .addrbind == "127.0.0.1:2358"')" -ge 2 ] \
            || fail "node1 does not see node3 and node4 as inbound peers on its onion bind"
          [ "$(count node1 '.inbound and .addrbind != "127.0.0.1:2358"')" -eq 0 ] \
            || fail "node1 has an inbound peer that did not arrive on its onion bind"

          # node2: listen=0, so it has no inbound peers, no P2P listener and no onion service.
          [ "$(count node2 '.inbound')" -eq 0 ] || fail "node2 has an inbound peer with listen=0"
          [ "$(listeners tor2 | awk '$4 ~ /:2357$/' | wc -l)" -eq 0 ] || fail "node2 listens on its P2P port with listen=0"
          if debug_log node2 | grep -q "torcontrol thread start"; then fail "node2 started Tor control with listen=0"; fi

          # node3: no proxy; node4 arrives from Tor on the onion bind, not the clearnet one.
          [ "$(count node3 '.inbound and .addrbind == "127.0.0.1:2368"')" -ge 1 ] \
            || fail "node3 does not see node4 as an inbound peer on its onion bind"
          [ "$(count node3 '.inbound and .addrbind != "127.0.0.1:2368"')" -eq 0 ] \
            || fail "node3 has an inbound peer that did not arrive on its onion bind"

          # node4: the onion services are reached through the -onion proxy, so their
          # sockets are local to 127.0.0.1; the testnet peer is a direct clearnet connection.
          for o in "$NODE1_ONION" "$NODE3_ONION" "$NODE5_ONION"; do
            [ "$(count node4 "(.inbound | not) and .addr == \"$o\" and (.addrbind | startswith(\"127.0.0.1:\"))")" -ge 1 ] \
              || fail "node4's connection to $o does not go through the Tor SOCKS proxy"
          done
          [ "$(count node4 "(.inbound | not) and (.addr | startswith(\"$TESTNET_SEED\")) and (.addrbind | startswith(\"127.0.0.1:\") | not)")" -ge 1 ] \
            || fail "node4's testnet peer is not a direct clearnet connection"
          via_socks tor4 || fail "node4 has no connection to its Tor SOCKS port"

          # node5: reached only through tor2's hand-made onion service, on its onion bind;
          # with listenonion=0 it never talks to Tor control, and it dials no one.
          [ "$(count node5 '.inbound and .addrbind == "127.0.0.1:2358"')" -ge 1 ] \
            || fail "node5 does not see node4 as an inbound peer on its onion bind"
          [ "$(count node5 '.inbound and .addrbind != "127.0.0.1:2358"')" -eq 0 ] \
            || fail "node5 has an inbound peer that did not arrive on its onion bind"
          [ "$(count node5 '.inbound | not')" -eq 0 ] || fail "node5 has an outbound peer with connect=0"
          if debug_log node5 | grep -q "torcontrol thread start"; then fail "node5 started Tor control with listenonion=0"; fi

          for n in 1 2 3 4 5; do
            [ "$(count "node$n" '.inbound and .whitelisted')" -eq 0 ] || fail "node$n whitelisted an inbound peer"
          done
          echo "PASSED: outbound traffic takes the configured route, and each node tags its Tor inbound peers by bind"

      - name: Dump logs
        if: always()
        run: |
          for n in 1 2 3 4 5; do
            echo "== node$n debug.log =="
            docker exec "node$n" sh -c 'cat /var/lib/tapyrus/*/debug.log' 2>/dev/null | tail -n 3000 || true
          done
          for t in tor1 tor2 tor4; do
            echo "== $t log =="
            docker logs "$t" 2>&1 | tail -n 200 || true
          done

      - name: Stop and remove containers/network
        if: always()
        run: |
          docker rm -f node1 node2 node3 node4 node5 tor1 tor2 tor4 || true
          docker network rm tor-test-net || true

  upnp-port-mapping:
    name: UPnP port mapping (real IGD)
    runs-on: ubuntu-latest
    # Verifies -DWITH_MINIUPNPC=ON's actual port-mapping code path (mapport.cpp's
    # ThreadMapPort) against a real UPnP IGD implementation (miniupnpd), not
    # just that it compiles.
    #
    # tapyrusd and the fake router (miniupnpd) each need their own network
    # namespace for this to test anything meaningfully. Two Docker
    # containers on one user-defined bridge network are needed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.test_branch || github.ref || 'master' }}
          submodules: recursive

      - name: Install build dependencies
        timeout-minutes: 10
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y cmake clang libboost-dev libevent-dev libminiupnpc-dev pkg-config

      - name: Use the runner's Ubuntu release for the containers
        # tapyrusd is built here and run in a container, so both need the same
        # libraries. The containers install the -dev packages below because
        # their names, unlike the runtime libraries', don't change per release.
        run: |
          source /etc/os-release
          echo "UBUNTU_IMAGE=ubuntu:${VERSION_ID}" >> "$GITHUB_ENV"

      - name: Build tapyrusd and tapyrus-genesis with UPnP support
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_DAEMON=ON -DBUILD_GUI=OFF -DBUILD_CLI=OFF -DBUILD_GENESIS=ON \
            -DENABLE_WALLET=OFF -DENABLE_TESTS=OFF -DENABLE_BENCH=OFF -DENABLE_ZMQ=OFF \
            -DWITH_MINIUPNPC=ON
          cmake --build build --target tapyrusd tapyrus-genesis -j "$(nproc)"

      - name: Generate a throwaway dev genesis block
        # A fresh, single-use signing key -- this node never talks to any
        # other tapyrus node, so there's nothing that needs a stable/shared
        # aggregate pubkey across runs.
        run: |
          mkdir -p upnp_test/data
          keypair="$(./build/bin/tapyrus-genesis -dev -generatekey)"
          pubkey="$(echo "${keypair}" | sed -n 's/^public key: //p')"
          privkey="$(echo "${keypair}" | sed -n 's/^private key: //p')"
          ./build/bin/tapyrus-genesis -dev \
            -signblockpubkey="${pubkey}" \
            -signblockprivatekey="${privkey}" \
            > upnp_test/data/genesis.dat

          cat << EOF > upnp_test/data/tapyrus.conf
          dev=1
          [dev]
          server=1
          listen=1
          discover=1
          upnp=1
          port=18333
          rpcport=18332
          printtoconsole=1
          debug=net
          signblockpubkey=${pubkey}
          EOF

      - name: Start the fake UPnP IGD (miniupnpd)
        run: |
          docker network create upnp-test-net

          docker run -d --name upnp_igd \
            --cap-add=NET_ADMIN \
            --network upnp-test-net \
            "$UBUNTU_IMAGE" sleep infinity

          # miniupnpd.conf is written *after* installing the package, not
          # bind-mounted in beforehand -- the package's postinst debconf
          # templating does its own `sed -i` on this exact path, which fails
          # with "Device or resource busy" against a bind-mounted file
          # (confirmed directly while designing this job).
          docker exec upnp_igd bash -c "
            apt-get update -qq &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq miniupnpd miniupnpc nftables &&
            cat > /etc/miniupnpd/miniupnpd.conf << 'EOF'
          ext_ifname=eth0
          listening_ip=eth0
          port=2189
          enable_natpmp=no
          enable_upnp=yes
          secure_mode=no
          ext_ip=8.8.8.8
          EOF
            CONFFILE=/etc/miniupnpd/miniupnpd.conf /usr/libexec/miniupnpd-startstop-helper.sh start
          "
          docker exec -d upnp_igd bash -c \
            "miniupnpd -f /etc/miniupnpd/miniupnpd.conf -d > /var/log/miniupnpd.log 2>&1"

      - name: Start tapyrusd with -upnp=1 in its own network namespace
        run: |
          docker run -d --name upnp_node \
            --network upnp-test-net \
            -v "$PWD/build/bin/tapyrusd:/usr/local/bin/tapyrusd:ro" \
            -v "$PWD/upnp_test/data:/data" \
            "$UBUNTU_IMAGE" bash -c "
              apt-get update -qq &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                libevent-dev libminiupnpc-dev &&
              exec tapyrusd -datadir=/data
            "

      - name: Wait for discovery and mapping, then verify against the IGD
        # Polls instead of sleeping a fixed time: the apt-get install in
        # upnp_node, tapyrusd startup, miniupnpd startup and SSDP discovery
        # all happen asynchronously before the mapping can appear.
        run: |
          deadline=$((SECONDS + 180))
          until docker exec upnp_igd upnpc -l > mappings.txt 2>&1 \
                && grep -q "18333->" mappings.txt \
                && grep -q "'Tapyrus" mappings.txt; do
            if [ "$(docker inspect -f '{{.State.Running}}' upnp_node)" != "true" ]; then
              echo "FAILED: tapyrusd container exited before any mapping appeared"
              exit 1
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              cat mappings.txt
              if grep -q "18333->" mappings.txt; then
                echo "FAILED: mapping for 18333 exists but its description doesn't identify tapyrusd -- check for a stale/unrelated mapping"
              else
                echo "FAILED: no port mapping for 18333 found on the fake IGD within 180s"
              fi
              exit 1
            fi
            sleep 2
          done

          echo "== tapyrusd's own view =="
          docker exec upnp_node cat /data/dev-1905960821/debug.log | grep -i upnp || true

          echo "== the fake router's own mapping table =="
          cat mappings.txt

          echo "PASSED: tapyrusd successfully mapped its listening port via UPnP"

      - name: Dump logs
        if: always()
        run: |
          echo "== tapyrusd debug.log =="
          docker exec upnp_node cat /data/dev-1905960821/debug.log || true
          echo "== miniupnpd log =="
          docker exec upnp_igd cat /var/log/miniupnpd.log || true

      - name: Stop and remove containers/network
        if: always()
        run: |
          docker rm -f upnp_node upnp_igd || true
          docker network rm upnp-test-net || true

  integration-test:
    # Started from here because GitHub disables schedules in inactive
    # repositories, and tapyrus-integration-tests changes rarely. The run also
    # shows in this repository's Actions tab. Keep @main: a called run always
    # gets that repository's default branch scripts.
    if: github.event_name == 'schedule'
    uses: chaintope/tapyrus-integration-tests/.github/workflows/weekly-integration-test.yml@main
