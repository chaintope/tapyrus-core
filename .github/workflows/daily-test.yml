# Purpose: catch regressions that are too slow to check on every push, once a
# day on master and on every pull request.
#   daily-test: builds every supported platform/feature combination (Linux
#     x86_64/ARM64, macOS ARM64, cross builds for macOS and Windows) and runs
#     unit, util and extended functional tests on the native ones. Tapyrus is
#     always compiled from scratch; depends is restored from cache unless
#     anything under depends/ changed. The RelWithDebInfo and Release
#     GUI+Wallet builds also run the benchmarks and record their trend on
#     scheduled runs.
#   fuzz-code-only, fuzz-script-sweep: scheduled fuzzing of the libFuzzer
#     targets and of Tapyrus Script via tapyrus-verify --fuzz.

name: Cmake Daily Test

on:
  schedule:
    # Run daily at 3 AM JST (6 PM UTC previous day)
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      test_branch:
        description: 'Branch to test (default: current branch or master)'
        type: string
        default: ''
        required: false
      fuzz_total_seconds:
        description: 'Fuzz job: total fuzzing seconds, split evenly across all fuzz targets'
        type: string
        default: '4200'
      fuzz_slice_batch_size:
        description: 'Fuzz job: number of seed-pool files to rotate in per target per run'
        type: string
        default: '5'
      sweep_time_budget_seconds:
        description: 'Script-sweep job: stop the rotating tapyrus-verify --fuzz sweep after roughly this many seconds'
        type: string
        default: '1800'

  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_FAILFAST_TEST_LEAVE_DANGLING: 1
  CTEST_OUTPUT_ON_FAILURE: 'ON'
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  LC_ALL: C.UTF-8
  BOOST_TEST_RANDOM: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  HOMEBREW_NO_ENV_HINTS: 1
  # apt fails fast instead of hanging on a flaky runner mirror.
  APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10

jobs:
  daily-test:
    strategy:
      fail-fast: false
      matrix:
        # GUI+Wallet is built as Debug, RelWithDebInfo and Release per native
        # platform+arch: Release is what ships, RelWithDebInfo gives the same
        # code path with symbols for debugging a crash.
        # collect_benchmark_history: run bench_tapyrus and keep its history.
        #   Set on the RelWithDebInfo and Release GUI+Wallet entries.
        # save_depends_cache: this entry saves the depends cache; all others
        #   only restore it. Exactly one entry per key, so saves never race:
        #   the RelWithDebInfo GUI+Wallet entry per native platform+arch and
        #   each cross entry, which has its own key. On x86_64 and macOS the
        #   saved depends cover every other entry; on Linux ARM they lack
        #   systemtap, which the USDT Debug entry builds itself.
        config:
          # Linux configurations with feature combinations
          - name: L-X86-Deb-GUI+USDT+Wallet
            os: ubuntu-latest
            platform: linux
            build_type: Debug
            enable_gui: true
            enable_usdt: true
            enable_wallet: true
          - name: L-X86-Rel-GUI+USDT+Wallet
            os: ubuntu-latest
            platform: linux
            build_type: RelWithDebInfo
            enable_gui: true
            enable_usdt: true
            enable_wallet: true
            collect_benchmark_history: true
            save_depends_cache: true
          - name: L-X86-Release-GUI+USDT+Wallet
            os: ubuntu-latest
            platform: linux
            build_type: Release
            enable_gui: true
            enable_usdt: true
            enable_wallet: true
            collect_benchmark_history: true
          - name: L-X86-Rel-No_GUI+USDT+Wallet
            os: ubuntu-latest
            platform: linux
            build_type: RelWithDebInfo
            enable_gui: false
            enable_usdt: true
            enable_wallet: true
          - name: L-X86-Rel-No_GUI+No_Wallet
            os: ubuntu-latest
            platform: linux
            build_type: RelWithDebInfo
            enable_gui: false
            enable_usdt: false
            enable_wallet: false
          # ubuntu-24.04-arm -- a genuine native ARM64 runner
          - name: L-ARM-Deb-GUI+USDT+Wallet
            os: ubuntu-24.04-arm
            platform: linux
            build_type: Debug
            enable_gui: true
            enable_usdt: true
            enable_wallet: true
          - name: L-ARM-Rel-GUI+Wallet
            os: ubuntu-24.04-arm
            platform: linux
            build_type: RelWithDebInfo
            enable_gui: true
            enable_usdt: false
            enable_wallet: true
            collect_benchmark_history: true
            save_depends_cache: true
          - name: L-ARM-Release-GUI+Wallet
            os: ubuntu-24.04-arm
            platform: linux
            build_type: Release
            enable_gui: true
            enable_usdt: false
            enable_wallet: true
            collect_benchmark_history: true
          - name: L-ARM-Rel-No_GUI+No_Wallet
            os: ubuntu-24.04-arm
            platform: linux
            build_type: RelWithDebInfo
            enable_gui: false
            enable_usdt: false
            enable_wallet: false
          # macOS configurations with feature combinations(NO USDT support)
          - name: M-ARM-Deb-GUI+Wallet
            os: macos-latest
            platform: macos
            build_type: Debug
            enable_gui: true
            enable_usdt: false
            enable_wallet: true
          - name: M-ARM-Rel-GUI+Wallet
            os: macos-latest
            platform: macos
            build_type: RelWithDebInfo
            enable_gui: true
            enable_usdt: false
            enable_wallet: true
            collect_benchmark_history: true
            save_depends_cache: true
          - name: M-ARM-Release-GUI+Wallet
            os: macos-latest
            platform: macos
            build_type: Release
            enable_gui: true
            enable_usdt: false
            enable_wallet: true
            collect_benchmark_history: true
          - name: M-ARM-Rel-No_GUI+Wallet
            os: macos-latest
            platform: macos
            build_type: RelWithDebInfo
            enable_gui: false
            enable_usdt: false
            enable_wallet: true
          - name: M-ARM-Rel-No_GUI+No_Wallet
            os: macos-latest
            platform: macos
            build_type: RelWithDebInfo
            enable_gui: false
            enable_usdt: false
            enable_wallet: false
          - name: L-Cross-M-X86-Rel-GUI+Wallet
            os: ubuntu-latest
            platform: linux
            target_platform: macos
            target_arch: x86_64
            build_type: RelWithDebInfo
            enable_gui: true
            enable_usdt: false
            enable_wallet: true
            save_depends_cache: true
          - name: L-Cross-M-ARM-Rel-GUI+Wallet
            os: ubuntu-latest
            platform: linux
            target_platform: macos
            target_arch: arm64
            build_type: RelWithDebInfo
            enable_gui: true
            enable_usdt: false
            enable_wallet: true
            save_depends_cache: true
          - name: L-Cross-W-X86-Rel-GUI+Wallet
            os: ubuntu-latest
            platform: linux
            target_platform: windows
            target_arch: x86_64
            build_type: RelWithDebInfo
            enable_gui: true
            enable_usdt: false
            enable_wallet: true
            save_depends_cache: true
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 300  # 5 hours timeout for daily tests
    env:
      BASE_ROOT_DIR: ${{ github.workspace }}
      BASE_BUILD_DIR: ${{ github.workspace }}/build
      DEPENDS_DIR: ${{ github.workspace }}/depends

    steps:
      - uses: actions/checkout@v5
        with:
          # Use manual input if provided, otherwise use current branch (for PRs) or master (for scheduled runs)
          ref: ${{ github.event.inputs.test_branch || github.ref || 'master' }}
          submodules: recursive

      - name: Determine host architecture
        # Replaces this matrix's own now-removed arch: label
        #
        # DEPENDS_CACHE_ID: native entries share one depends key per
        # platform+arch; each cross entry gets its own, since it builds for a
        # different HOST than the runner.
        # DEPENDS_HASH: hash of every tracked file under depends/, so any
        # change there changes the depends cache key.
        run: |
          case "$(uname -m)" in
            x86_64) ARCH=x86_64 ;;
            arm64|aarch64) ARCH=arm64 ;;
            *) ARCH=$(uname -m) ;;
          esac
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          if [ -n "${{ matrix.config.target_platform }}" ]; then
            echo "DEPENDS_CACHE_ID=cross-${{ matrix.config.target_platform }}-${{ matrix.config.target_arch }}" >> $GITHUB_ENV
          else
            echo "DEPENDS_CACHE_ID=${{ matrix.config.platform }}-$ARCH" >> $GITHUB_ENV
          fi
          echo "DEPENDS_HASH=$(git ls-files -s depends | git hash-object --stdin)" >> $GITHUB_ENV

      - name: Restore Depends cache
        # Exact key only, no restore-keys fallback: if anything under depends/
        # changed, depends is built from scratch instead of on top of an older
        # tree.
        id: depends-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DEPENDS_DIR }}
          key: depends-v6-qt6-${{ env.DEPENDS_CACHE_ID }}-${{ env.DEPENDS_HASH }}

      - name: Restore Benchmark History cache
        # Benchmarks only run on scheduled/manually-dispatched runs, not on
        # every PR (see the gated benchmark step further down). Gated on the
        # collect_benchmark_history matrix field. Keyed by entry name, so each
        # entry keeps its own history.
        if: github.event_name != 'pull_request' && matrix.config.collect_benchmark_history == true
        id: benchmark-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/benchmark_results/data
          key: benchmark-history-${{ matrix.config.name }}-${{ github.run_id }}
          restore-keys: benchmark-history-${{ matrix.config.name }}-

      - name: Setup Linux Dependencies
        timeout-minutes: 15
        if: matrix.config.platform == 'linux'
        env:
          ACTIONS_RUNNER_DEBUG: true
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y gcc g++ build-essential cmake ninja-build pkgconf python3-zmq bsdmainutils systemtap-sdt-dev bpfcc-tools bpftrace python3-venv valgrind libboost-test-dev python3-pip gperf bison
          # libxkbcommon >= 1.9.0 requires Meson >= 1.4.0; Ubuntu 24.04's apt
          # package (1.3.2) is too old, so install a current one via pip instead.
          # Pinned to an exact version (like every depends package) rather than
          # a floor, so the build tool itself doesn't float across CI runs.
          sudo pip3 install --break-system-packages --no-cache-dir "meson==1.4.0"

          # Install cross-compilation toolchain for macOS targets
          if [ "${{ matrix.config.target_platform }}" == "macos" ]; then
            sudo apt-get $APT_OPTS install -y curl git cmake ninja-build clang lld llvm llvm-dev
            # Set up macOS SDK for cross-compilation
            # Read SDK variables from depends/hosts/darwin.mk
            mkdir -p depends/SDKs
            export XCODE_VERSION=$(grep '^XCODE_VERSION=' depends/hosts/darwin.mk | cut -d= -f2)
            export XCODE_BUILD_ID=$(grep '^XCODE_BUILD_ID=' depends/hosts/darwin.mk | cut -d= -f2)
            OSX_SDK_BASENAME="Xcode-${XCODE_VERSION}-${XCODE_BUILD_ID}-extracted-SDK-with-libcxx-headers"

            # Download and extract macOS SDK if not present
            if [ ! -d "depends/SDKs/${OSX_SDK_BASENAME}" ]; then
              OSX_SDK_FILENAME="${OSX_SDK_BASENAME}.tar.gz"
              OSX_SDK_PATH="depends/sdk-sources/${OSX_SDK_FILENAME}"
              mkdir -p depends/sdk-sources

              # Download SDK: try bitcoincore.org first, fall back to Tapyrus S3
              if [ ! -f "$OSX_SDK_PATH" ]; then
                SDK_URL="https://bitcoincore.org/depends-sources/sdks"
                FALLBACK_URL="https://s3.ap-northeast-1.amazonaws.com/repo.tapyrus.chaintope.com"
                echo "Downloading macOS SDK from bitcoincore.org..."
                curl --location --fail "${SDK_URL}/${OSX_SDK_FILENAME}" -o "$OSX_SDK_PATH" || {
                  echo "Failed to download SDK from bitcoincore.org, trying Tapyrus S3..."
                  curl --location --fail "${FALLBACK_URL}/${OSX_SDK_FILENAME}" -o "$OSX_SDK_PATH" || {
                    echo "Failed to download SDK from all sources"
                    exit 1
                  }
                }
              fi

              echo "Extracting macOS SDK..."
              tar -C "depends/SDKs" -xf "$OSX_SDK_PATH" || {
                echo "Failed to extract SDK"
                exit 1
              }
            fi
          fi

          # Install cross-compilation toolchain for Windows targets
          if [ "${{ matrix.config.target_platform }}" == "windows" ]; then
            sudo apt-get $APT_OPTS install -y g++-mingw-w64-x86-64 mingw-w64-x86-64-dev binutils-mingw-w64-x86-64 wine64 nsis
            sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
            sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          fi

          python3 -m venv $HOME/venv
          source $HOME/venv/bin/activate
          pip3 install pyzmq matplotlib

      - name: Setup macOS Dependencies
        if: matrix.config.platform == 'macos'
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
          ACTIONS_RUNNER_DEBUG: true
        run: |
          if [ -d "/Applications/Xcode_15.0.app" ]; then
            sudo xcode-select --switch /Applications/Xcode_15.0.app
          else
            echo "Xcode 15.0 not found, skipping xcode-select"
          fi

          brew install --quiet coreutils ninja pkgconf gnu-getopt boost

          python3 -m venv $HOME/venv
          source $HOME/venv/bin/activate
          pip3 install pyzmq matplotlib

      - name: Build Depends
        env:
          ACTIONS_STEP_DEBUG: true
        run: |
          # Determine HOST based on platform and architecture (including cross-compilation)
          if [ "${{ matrix.config.platform }}" == "macos" ]; then
            NATIVE_ARCH=$(uname -m)
            if [ "$NATIVE_ARCH" == "arm64" ]; then
              export HOST="arm64-apple-darwin"
            else
              export HOST="x86_64-apple-darwin"
            fi
            CPU_COUNT=$(sysctl -n hw.ncpu)
          elif [ "${{ matrix.config.target_platform }}" == "macos" ]; then
            # Cross-compilation: Linux -> macOS
            if [ "${{ matrix.config.target_arch }}" == "arm64" ]; then
              export HOST="arm64-apple-darwin"
            else
              export HOST="x86_64-apple-darwin"
            fi
            CPU_COUNT=$(nproc)
          elif [ "${{ matrix.config.target_platform }}" == "windows" ]; then
            # Cross-compilation: Linux -> Windows
            export HOST="x86_64-w64-mingw32"
            CPU_COUNT=$(nproc)
          else
            # Native Linux builds
            NATIVE_ARCH=$(uname -m)
            if [ "$NATIVE_ARCH" == "aarch64" ]; then
              export HOST="aarch64-linux-gnu"
            else
              export HOST="x86_64-pc-linux-gnu"
            fi
            CPU_COUNT=$(nproc)
          fi

          echo "Building depends for HOST=$HOST"

          # Persist HOST for later steps (e.g. "Build and run daily tests") so
          # the platform/target_platform -> HOST triple resolution logic
          # lives in exactly one place.
          echo "HOST=$HOST" >> $GITHUB_ENV

          # Set up environment for cross-compilation
          if [ "${{ matrix.config.target_platform }}" == "macos" ]; then
            export SDK_PATH="${{ github.workspace }}/depends/SDKs"
            export XCODE_VERSION=$(grep '^XCODE_VERSION=' depends/hosts/darwin.mk | cut -d= -f2)
            export XCODE_BUILD_ID=$(grep '^XCODE_BUILD_ID=' depends/hosts/darwin.mk | cut -d= -f2)
            export OSX_SDK="$SDK_PATH/Xcode-${XCODE_VERSION}-${XCODE_BUILD_ID}-extracted-SDK-with-libcxx-headers"
            export OSX_MIN_VERSION=$(grep '^OSX_MIN_VERSION=' depends/hosts/darwin.mk | cut -d= -f2)
            export OSX_SDK_VERSION=$(grep '^OSX_SDK_VERSION=' depends/hosts/darwin.mk | cut -d= -f2)
            echo "Using macOS SDK: $OSX_SDK"

            # Test the cross-compilation toolchain
            echo "Testing cross-compilation toolchain..."
            clang --target=$HOST --version || echo "Warning: clang target test failed"
          fi

          # Set depends options based on build configuration
          DEPENDS_OPTS="HOST=$HOST"
          if [ "${{ matrix.config.enable_gui }}" == "false" ]; then
            DEPENDS_OPTS="$DEPENDS_OPTS NO_QT=1"
          fi
          if [ "${{ matrix.config.enable_wallet }}" == "false" ]; then
            DEPENDS_OPTS="$DEPENDS_OPTS NO_WALLET=1"
          fi
          if [ "${{ matrix.config.enable_usdt }}" == "false" ]; then
            DEPENDS_OPTS="$DEPENDS_OPTS NO_USDT=1"
          fi

          # Check if depends is already built and valid
          DEPENDS_PREFIX="$DEPENDS_DIR/$HOST"
          if [ -d "$DEPENDS_PREFIX" ] && [ -d "$DEPENDS_PREFIX/lib" ] && [ -d "$DEPENDS_PREFIX/include" ]; then
            echo "Depends appears to be already built, verifying required dependencies..."

            # Define required files based on configuration
            REQUIRED_FILES=()
            MISSING_FILES=()

            # Base packages - always required
            REQUIRED_FILES+=("$DEPENDS_PREFIX/lib/libevent.a")
            REQUIRED_FILES+=("$DEPENDS_PREFIX/lib/libzmq.a")
            REQUIRED_FILES+=("$DEPENDS_PREFIX/include/boost/config.hpp")
            REQUIRED_FILES+=("$DEPENDS_PREFIX/include/zmq.h")

            # GUI dependencies - Qt6 is built statically on all platforms in depends
            if [ "${{ matrix.config.enable_gui }}" == "true" ]; then
              # Check for CMake config files instead of libraries (more reliable for static builds)
              REQUIRED_FILES+=("$DEPENDS_PREFIX/lib/cmake/Qt6/Qt6Config.cmake")
              REQUIRED_FILES+=("$DEPENDS_PREFIX/lib/cmake/Qt6Core/Qt6CoreConfig.cmake")
            fi

            # Wallet dependencies (Berkeley DB)
            if [ "${{ matrix.config.enable_wallet }}" == "true" ]; then
              REQUIRED_FILES+=("$DEPENDS_PREFIX/lib/libdb_cxx-5.3.a")
              REQUIRED_FILES+=("$DEPENDS_PREFIX/lib/libdb-5.3.a")
              REQUIRED_FILES+=("$DEPENDS_PREFIX/include/db_cxx.h")
              REQUIRED_FILES+=("$DEPENDS_PREFIX/include/db.h")
            fi

            # USDT dependencies (Linux only)
            if [ "${{ matrix.config.enable_usdt }}" == "true" ] && [ "${{ matrix.config.platform }}" == "linux" ]; then
              REQUIRED_FILES+=("$DEPENDS_PREFIX/include/sys/sdt.h")
            fi

            # Check all required files
            echo "Checking for ${#REQUIRED_FILES[@]} required dependency files..."
            echo "DEPENDS_PREFIX: $DEPENDS_PREFIX"
            echo "Configuration: GUI=${{ matrix.config.enable_gui }} WALLET=${{ matrix.config.enable_wallet }} USDT=${{ matrix.config.enable_usdt }}"
            echo "Platform: ${{ matrix.config.platform }}"

            for file in "${REQUIRED_FILES[@]}"; do
              if [ ! -f "$file" ]; then
                MISSING_FILES+=("$file")
                echo "Missing: $file"
              fi
            done

            if [ ${#MISSING_FILES[@]} -eq 0 ]; then
              echo "Depends verification passed - all ${#REQUIRED_FILES[@]} required files found"
            else
              echo "Depends verification failed - ${#MISSING_FILES[@]} files missing"
              rm -rf "$DEPENDS_PREFIX"
            fi
          fi

          # Always run make: it builds any package the restored tree lacks
          # (e.g. systemtap for USDT entries) and is a fast no-op otherwise.
          echo "----------------   Building Depends $HOST     ----------------"
          if ! make -C depends $DEPENDS_OPTS -j$CPU_COUNT install_cmake; then
            echo "Depends build failed"
            exit 1
          fi

          # Verify the build completed successfully
          if [ ! -d "$DEPENDS_PREFIX" ] || [ ! -d "$DEPENDS_PREFIX/lib" ]; then
            echo "Depends build failed: $DEPENDS_PREFIX or lib directory not found"
            exit 1
          fi

          # Verify toolchain file was generated
          if [ ! -f "$DEPENDS_PREFIX/toolchain.cmake" ]; then
            echo "Toolchain file not found at $DEPENDS_PREFIX/toolchain.cmake"
          else
            echo "Toolchain file generated at $DEPENDS_PREFIX/toolchain.cmake"
          fi

          echo "---------------- Depends build completed for $HOST ---------------- "
          echo "Contents of $DEPENDS_PREFIX:"
          ls -la "$DEPENDS_PREFIX/" || true
          echo "Libraries in $DEPENDS_PREFIX/lib:"
          ls -la "$DEPENDS_PREFIX/lib/" | head -10 || true
          echo "Libraries in $DEPENDS_PREFIX/include:"
          ls -la "$DEPENDS_PREFIX/include/" | head -10 || true
          echo "---------------- ----------------- --------------- ---------------- "

      - name: Save Depends cache
        # Only save_depends_cache entries save, so the cached tree is the full
        # GUI+wallet set. A saved key can't be overwritten, so an entry with a
        # smaller set saving first would leave the others rebuilding Qt/BDB.
        if: github.ref == 'refs/heads/master' && matrix.config.save_depends_cache == true
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.DEPENDS_DIR }}
          key: depends-v6-qt6-${{ env.DEPENDS_CACHE_ID }}-${{ env.DEPENDS_HASH }}

      - name: Enable core dumps
        if: matrix.config.target_platform != 'windows'
        run: |
          CORE_DUMP_DIR="${{ github.workspace }}/core_dumps"
          mkdir -p "$CORE_DUMP_DIR"
          if [ "${{ matrix.config.platform }}" == "linux" ]; then
            sudo sysctl -w kernel.core_pattern="$CORE_DUMP_DIR/core.%e.%p"
          else
            sudo sysctl -w kern.corefile="$CORE_DUMP_DIR/core.%N"
          fi
          echo "Core dumps will be stored in: $CORE_DUMP_DIR"
          TEST_DIR="${{ github.workspace }}/tapyrus_test"
          mkdir -p "$TEST_DIR"
          echo "TAPYRUS_TEST_DIR=$TEST_DIR" >> $GITHUB_ENV

      - name: Build and run daily tests
        env:
          TAPYRUS_TEST_DIR: ${{ env.TAPYRUS_TEST_DIR }}
          ACTIONS_STEP_DEBUG: true
        run: |
          # ulimit is per-process and does not carry over from the "Enable
          # core dumps" step (each `run:` block is a separate shell) -- it
          # must be set here, in the shell that actually execs the test
          # binaries and their children (ctest, test_runner.py -> tapyrusd).
          ulimit -c unlimited

          if [ "${{ matrix.config.platform }}" == "macos" ]; then
            CPU_COUNT=$(sysctl -n hw.ncpu)
          else
            CPU_COUNT=$(nproc)
          fi

          # Create dummy .tapyrus file to prevent default datadir from being used
          echo ">" $HOME/.tapyrus

          # Set compiler based on platform (OS defaults and cross-compilation)
          if [ "${{ matrix.config.platform }}" == "macos" ] || [ "${{ matrix.config.target_platform }}" == "macos" ]; then
            export CC="clang"
            export CXX="clang++"
          else
            export CC="gcc"
            export CXX="g++"
          fi

          # HOST (platform/target_platform -> triple) is resolved once in the
          # "Build Depends" step and persisted via $GITHUB_ENV; reused here.
          DEPENDS_PREFIX="$DEPENDS_DIR/$HOST"

          # Verify depends directory exists and has required files
          if [ ! -d "$DEPENDS_PREFIX" ]; then
            echo "Error: Depends directory $DEPENDS_PREFIX not found"
            echo "Available directories in $DEPENDS_DIR:"
            ls -la "$DEPENDS_DIR" || echo "Depends directory not found"
            exit 1
          fi

          # Common CMake configuration options
          # BUILD_FUZZ_TEST defaults OFF here. The native-build branch below turns
          # BUILD_FUZZ_TEST back ON
          # No ccache: Tapyrus is always compiled from scratch, so stale
          # objects can't hide an incompatibility with the cached depends.
          CMAKE_OPTS=(
            "-DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}"
            -DCMAKE_PREFIX_PATH="$DEPENDS_PREFIX"
            -DBUILD_FUZZ_TEST=OFF
            -DWITH_CCACHE=OFF
          )

          # Set test and benchmark options based on build type
          if [ "${{ matrix.config.target_platform }}" != "" ] && [ "${{ matrix.config.target_platform }}" != "${{ matrix.config.platform }}" ]; then
            # Cross-compilation: disable tests and benchmarks
            CMAKE_OPTS+=("-DENABLE_TESTS=OFF" "-DENABLE_BENCH=OFF" "-DBUILD_UTILS=ON")
          else
            # Native builds: enable tests and benchmarks
            CMAKE_OPTS+=("-DENABLE_TESTS=ON" "-DENABLE_BENCH=ON" "-DCP2SH_ACTIVATION_TEST_HEIGHT=120")
            # Build and test tapyrus-verify on every native job; also
            # compile-check its --fuzz mode (see comment above) on every PR.
            CMAKE_OPTS+=("-DBUILD_SCRIPT_VERIFY=ON" "-DBUILD_FUZZ_TEST=ON")
          fi

          # Use depends-generated CMake toolchain file
          TOOLCHAIN_FILE="$DEPENDS_PREFIX/toolchain.cmake"
          if [ -f "$TOOLCHAIN_FILE" ]; then
            CMAKE_OPTS+=("-DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN_FILE")
            echo "Using depends toolchain file: $TOOLCHAIN_FILE"
          else
            echo "Toolchain file not found at $TOOLCHAIN_FILE"
            exit 1
          fi

          # GUI option
          if [ "${{ matrix.config.enable_gui }}" == "true" ]; then
            CMAKE_OPTS+=("-DBUILD_GUI=ON")
          else
            CMAKE_OPTS+=("-DBUILD_GUI=OFF")
          fi

          # USDT option
          if [ "${{ matrix.config.enable_usdt }}" == "true" ]; then
            CMAKE_OPTS+=("-DENABLE_TRACING=ON")
          else
            CMAKE_OPTS+=("-DENABLE_TRACING=OFF")
          fi

          # wallet options
          if [ "${{ matrix.config.enable_wallet }}" == "true" ]; then
            CMAKE_OPTS+=("-DENABLE_WALLET=ON" "-DWITH_BDB=ON")
          else
            CMAKE_OPTS+=("-DENABLE_WALLET=OFF" "-DWITH_BDB=OFF")
          fi

          # Platform-specific options
          #
          # Native macOS builds need no BDB warning override here: this
          # job builds BDB from depends (always 5.3.28, from source),
          # never from Homebrew, so the version this override used to
          # guard against was never actually in play.
          if [ "${{ matrix.config.target_platform }}" == "macos" ]; then
            # Cross-compilation to macOS from Linux
            CMAKE_OPTS+=("-DCMAKE_SYSTEM_NAME=Darwin")
            if [ "${{ matrix.config.target_arch }}" == "arm64" ]; then
              CMAKE_OPTS+=("-DCMAKE_SYSTEM_PROCESSOR=arm64")
              CMAKE_OPTS+=("-DCMAKE_OSX_ARCHITECTURES=arm64")
            else
              CMAKE_OPTS+=("-DCMAKE_SYSTEM_PROCESSOR=x86_64")
              CMAKE_OPTS+=("-DCMAKE_OSX_ARCHITECTURES=x86_64")
            fi
            OSX_MIN_VERSION=$(grep '^OSX_MIN_VERSION=' depends/hosts/darwin.mk | cut -d= -f2)
            CMAKE_OPTS+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=$OSX_MIN_VERSION")
            CMAKE_OPTS+=("-DWARN_INCOMPATIBLE_BDB=OFF")
          fi

          # Berkeley DB explicit include/lib paths (toolchain sets BerkeleyDB_ROOT
          # but not the specific header/library paths).
          if [ "${{ matrix.config.enable_wallet }}" == "true" ]; then
            CMAKE_OPTS+=("-DBerkeleyDB_INCLUDE_DIR=$DEPENDS_PREFIX/include")
            CMAKE_OPTS+=("-DBerkeleyDB_LIBRARY=$DEPENDS_PREFIX/lib/libdb_cxx-5.3.a")
          fi

          # Configure and build
          echo "Using depends prefix: $DEPENDS_PREFIX"
          echo "CMake configuration options:"
          printf '%s\n' "${CMAKE_OPTS[@]}"
          export PKG_CONFIG_PATH="$DEPENDS_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LD_LIBRARY_PATH="$DEPENDS_PREFIX/lib:$LD_LIBRARY_PATH"
          echo "Environment variables:"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          echo "---------------- Start cmake configure ---------------- "
          cmake -S "$BASE_ROOT_DIR" -B "$BASE_BUILD_DIR" -GNinja "${CMAKE_OPTS[@]}"

          echo "----------------   Start build   ---------------- "

          # For cross-compilation, only build essential binaries
          if [ "${{ matrix.config.target_platform }}" != "" ] && [ "${{ matrix.config.target_platform }}" != "${{ matrix.config.platform }}" ]; then
            cmake --build "$BASE_BUILD_DIR" --parallel -j "$CPU_COUNT" --target tapyrusd --target tapyrus-cli --target tapyrus-genesis --target tapyrus-tx
            if [ "${{ matrix.config.enable_gui }}" == "true" ]; then
              cmake --build "$BASE_BUILD_DIR" --parallel -j "$CPU_COUNT" --target tapyrus-qt
            fi
          else
            cmake --build "$BASE_BUILD_DIR" --parallel -j "$CPU_COUNT" --target all
          fi

          # Run daily test suite
          export CTEST_OUTPUT_ON_FAILURE=ON

          # --- Reporting: render a per-job table on the workflow run's Summary
          # page (GITHUB_STEP_SUMMARY). One call site per test phase below.
          DAILY_SUMMARY_HEADER_WRITTEN=0
          write_summary_header() {
            if [ "$DAILY_SUMMARY_HEADER_WRITTEN" -eq 0 ]; then
              {
                echo "## Daily Test Summary — ${{ matrix.config.name }}"
                echo ""
                echo "| Category | Status | Duration |"
                echo "|---|---|---|"
              } >> "$GITHUB_STEP_SUMMARY"
              DAILY_SUMMARY_HEADER_WRITTEN=1
            fi
          }
          record_phase() {
            # $1=category  $2=exit code (0=pass)  $3=start epoch seconds (from `date +%s`)
            local category="$1" rc="$2" start="$3"
            local dur=$(( $(date +%s) - start ))
            local status
            if [ "$rc" -eq 0 ]; then status="✅ Passed"; else status="❌ Failed"; fi
            write_summary_header
            echo "| $category | $status | $((dur / 60))m $((dur % 60))s |" >> "$GITHUB_STEP_SUMMARY"
          }
          record_skipped() {
            # $1=category  $2=reason
            write_summary_header
            echo "| $1 | ⏭️ Skipped ($2) | - |" >> "$GITHUB_STEP_SUMMARY"
          }

          # Skip tests for cross-compiled binaries (they won't run on Linux host)
          if [ "${{ matrix.config.target_platform }}" != "" ] && [ "${{ matrix.config.target_platform }}" != "${{ matrix.config.platform }}" ]; then
            echo "---------------- Cross-compilation build completed ---------------- "
            echo "Skipping tests for cross-compiled macOS binaries (cannot run on Linux host)"
            if [ "${{ matrix.config.target_platform }}" == "windows" ]; then
              echo "Build artifacts created for Windows ${{ matrix.config.target_arch }}"
            else
              echo "Build artifacts created for macOS ${{ matrix.config.target_arch }}"
            fi
            ls -la "$BASE_BUILD_DIR/bin/" || true
            record_skipped "All Tests" "cross-compiled binaries"
            echo "---------------- CROSS-COMPILATION BUILD FINISHED ---------------------"
            exit 0
          fi

          echo "---------------- Start unit test ---------------- "
          cd "$BASE_BUILD_DIR/bin"
          UNIT_START=$(date +%s)
          if [ "${{ matrix.config.platform }}" == "linux" ] && [ "${{ env.ARCH }}" == "x86_64"  ]; then
            if valgrind ./test_tapyrus --log_level=test_suite --report_level=short --build_info --catch_system_errors; then UNIT_RC=0; else UNIT_RC=$?; fi
          else
            if ./test_tapyrus --log_level=test_suite --report_level=short --build_info --catch_system_errors; then UNIT_RC=0; else UNIT_RC=$?; fi
          fi
          record_phase "Unit Tests (ctest)" "$UNIT_RC" "$UNIT_START"
          if [ "$UNIT_RC" -ne 0 ]; then exit 1; fi

          echo "---------------- Start Qt GUI test ---------------- "
          if [ "${{ matrix.config.enable_gui }}" == "true" ] && [ "${{ matrix.config.enable_wallet }}" == "true" ]; then
            # Qt GUI tests require a headless platform on CI agents; use minimal (statically linked)
            export QT_QPA_PLATFORM=minimal
            GUI_START=$(date +%s)
            # Run via CTest so the test name and WORKING_DIRECTORY are handled correctly
            if ctest --test-dir "$BASE_BUILD_DIR" -R "^test-tapyrus-qt$" --output-on-failure; then
              echo "Qt GUI tests passed"
              record_phase "Qt GUI Tests" 0 "$GUI_START"
            else
              echo "Qt GUI tests failed"
              record_phase "Qt GUI Tests" 1 "$GUI_START"
              exit 1
            fi
            unset QT_QPA_PLATFORM
          else
            echo "Skipping Qt GUI tests (GUI or wallet not enabled)"
            record_skipped "Qt GUI Tests" "GUI or wallet not enabled"
          fi

          echo "---------------- Start util test ---------------- "
          cd "$BASE_ROOT_DIR"
          UTIL_START=$(date +%s)
          if python3 test/util/tapyrus-util-test.py; then
            echo "Util tests passed"
            record_phase "Util Tests" 0 "$UTIL_START"
          else
            echo "Util tests failed"
            record_phase "Util Tests" 1 "$UTIL_START"
            exit 1
          fi

          if [ "${{ matrix.config.build_type }}" == "Debug" ]; then
            echo "---------------- Start debug mode functional tests ----------------"
            cd "$BASE_ROOT_DIR"
            DEBUG_FUNC_START=$(date +%s)
            if python3 test/functional/test_runner.py --tmpdir="$TAPYRUS_TEST_DIR" -j 1 --combinedlogslen=4000 --failfast --quiet --debugscripts; then
              echo "Debug mode functional tests passed"
              record_phase "Functional Tests (debugscripts)" 0 "$DEBUG_FUNC_START"
            else
              echo "Debug mode functional tests failed"
              record_phase "Functional Tests (debugscripts)" 1 "$DEBUG_FUNC_START"
              exit 1
            fi
            record_skipped "Benchmark" "Debug build"
            echo "--------------- DAILY DEBUG BUILD FINISHED ---------------------"
            exit 0
          fi

          echo "---------------- Start daily functional test suite ---------------- "
          cd "$BASE_ROOT_DIR"
          FUNC_START=$(date +%s)
          # Run the daily functional test suite including long-running tests
          if python3 test/functional/test_runner.py --tmpdir="$TAPYRUS_TEST_DIR" -j 1 --combinedlogslen=4000 --coverage --failfast --quiet --extended; then
            echo "daily functional tests passed"
            record_phase "Functional Tests (--extended)" 0 "$FUNC_START"
          else
            echo "daily functional tests failed"
            record_phase "Functional Tests (--extended)" 1 "$FUNC_START"
            exit 1
          fi

          # Benchmarks run only on the collect_benchmark_history entries, and
          # not on PRs, which already pay for the full functional-test matrix.
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "---------------- Skipping benchmark test (event: pull_request) ---------------- "
            record_skipped "Benchmark" "pull_request event"
          elif [ "${{ matrix.config.collect_benchmark_history }}" != "true" ]; then
            record_skipped "Benchmark" "not a benchmark configuration"
          else
            echo "---------------- Start benchmark test ---------------- "
            cd "$BASE_BUILD_DIR/bin"
            BENCH_START=$(date +%s)
            if ./bench_tapyrus -evals=100 > bench_results.txt; then
              echo "Benchmark tests passed"
              cat bench_results.txt
              record_phase "Benchmark" 0 "$BENCH_START"
            else
              echo "Benchmark tests failed"
              record_phase "Benchmark" 1 "$BENCH_START"
              exit 1
            fi

            # Append this run's per-benchmark medians to the cached history
            # and render a trend chart (one line per benchmark, one point per
            # day) into the job summary.
            echo "---------------- Updating benchmark history and chart ---------------- "
            HISTORY_DIR="${{ github.workspace }}/benchmark_results/data"
            mkdir -p "$HISTORY_DIR"
            HISTORY_CSV="$HISTORY_DIR/history.csv"
            RUN_DATE=$(date -u +%Y-%m-%d)
            RUN_COMMIT=$(cd "$BASE_ROOT_DIR" && git rev-parse --short HEAD)

            source $HOME/venv/bin/activate
            python3 "$BASE_ROOT_DIR/contrib/devtools/plot_benchmark_history.py" append \
              --bench-output bench_results.txt --csv "$HISTORY_CSV" \
              --date "$RUN_DATE" --commit "$RUN_COMMIT" \
              || echo "Warning: failed to append benchmark history, continuing"

            CHART_PATH="${{ github.workspace }}/benchmark_trend.png"
            if python3 "$BASE_ROOT_DIR/contrib/devtools/plot_benchmark_history.py" plot \
                --csv "$HISTORY_CSV" --out "$CHART_PATH" \
                --title "Benchmark history - ${{ matrix.config.name }}" && [ -f "$CHART_PATH" ]; then
              {
                echo ""
                echo "### Benchmark trend - ${{ matrix.config.name }}"
                echo ""
                echo "![benchmark trend](data:image/png;base64,$(python3 -c 'import base64,sys; sys.stdout.write(base64.b64encode(open(sys.argv[1], "rb").read()).decode())' "$CHART_PATH"))"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Warning: benchmark chart rendering failed, continuing"
            fi
            deactivate
          fi

          # # Test USDT tracing functionality if enabled
          # if [ "${{ matrix.config.enable_usdt }}" == "true" ]; then
          #   echo "---------------- Start USDT tracing tests ---------------- "
          #   cd "$BASE_ROOT_DIR"

          #   # Install BCC and bpftrace for USDT testing (Linux only)
          #   if [ "${{ matrix.config.platform }}" == "linux" ]; then
          #     echo "Installing BCC and bpftrace for tracing tests..."
          #     # Install BCC for Python USDT scripts
          #     python3 -m pip install bcc --user --quiet || echo "Warning: BCC installation failed"

          #     # Install bpftrace for .bt scripts (already installed in setup, but ensure it's available)
          #     which bpftrace || echo "Warning: bpftrace not available"

          #     # Run USDT functional tests (excluding coinselection as it tests non-existent tracepoints)
          #     echo "Running USDT functional tests..."
          #     if python3 test/functional/test_runner.py \
          #       --tmpdir="$TAPYRUS_TEST_DIR" \
          #       -j 1 \
          #       --combinedlogslen=4000 \
          #       --usdt \
          #       interface_usdt_mempool.py \
          #       interface_usdt_net.py \
          #       interface_usdt_utxocache.py; then
          #       echo "USDT functional tests passed"
          #     else
          #       echo "USDT functional tests failed, continuing..."
          #     fi

          #     # Test contrib tracing scripts with a short tapyrusd run
          #     echo "Testing contrib tracing scripts..."
          #     mkdir -p "$TAPYRUS_TEST_DIR/tracing_test"

          #     # Start tapyrusd in background for tracing tests
          #     cd "$BASE_BUILD_DIR/bin"
          #     ./tapyrusd -datadir="$TAPYRUS_TEST_DIR/tracing_test" -daemon -regtest -txindex=1 -fallbackfee=0.0002 || echo "Failed to start tapyrusd"
          #     sleep 5

          #     # Test Python tracing scripts (run each for 5 seconds)
          #     cd "$BASE_ROOT_DIR"
          #     for script in contrib/tracing/*.py; do
          #       if [ -f "$script" ]; then
          #         echo "Testing $(basename $script)..."
          #         timeout 5 python3 "$script" "$BASE_BUILD_DIR/bin/tapyrusd" &>/dev/null || echo "Script $(basename $script) test completed"
          #       fi
          #     done

          #     # Test bpftrace scripts syntax (without running, as they require root)
          #     for script in contrib/tracing/*.bt; do
          #       if [ -f "$script" ] && command -v bpftrace >/dev/null; then
          #         echo "Checking syntax of $(basename $script)..."
          #         bpftrace --dry-run "$script" &>/dev/null && echo "$(basename $script) syntax OK" || echo "$(basename $script) syntax issues"
          #       fi
          #     done

          #     # Stop tapyrusd
          #     ./tapyrus-cli -datadir="$TAPYRUS_TEST_DIR/tracing_test" -regtest stop 2>/dev/null || pkill tapyrusd
          #     sleep 2

          #     echo "USDT tracing scripts tested"
          #   else
          #     echo "Skipping USDT tracing tests on ${{ matrix.config.platform }} (Linux only)"
          #   fi
          # else
          #   echo "Skipping USDT tracing tests (USDT disabled)"
          # fi

          echo "---------------- DAILY TEST FINISHED ---------------------"

      - name: Save Benchmark History cache
        # Must run after "Build and run daily tests", which is the step that
        # actually creates benchmark_results/data and appends this run's
        # medians to history.csv
        if: github.event_name != 'pull_request' && matrix.config.collect_benchmark_history == true
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/benchmark_results/data
          key: benchmark-history-${{ matrix.config.name }}-${{ github.run_id }}

      - name: Upload Benchmark History
        # The cache holds only the latest copy; this keeps each run's history
        # for the maximum artifact retention as a backup.
        if: github.event_name != 'pull_request' && matrix.config.collect_benchmark_history == true
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-history-${{ matrix.config.name }}-${{ github.run_id }}
          path: ${{ github.workspace }}/benchmark_results/data/history.csv
          retention-days: 90
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-test-results-${{ matrix.config.name }}-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/tapyrus_test
            ${{ github.workspace }}/build/bin/bench_results.txt
            ${{ github.workspace }}/test/functional/test_framework/test_framework.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload coverage data
        if: matrix.config.build_type == 'Debug'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-data-${{ matrix.config.name }}-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/.coverage
            ${{ github.workspace }}/test/functional/coverage_html
          retention-days: 30

      - name: Upload Windows binaries
        if: matrix.config.target_platform == 'windows' && always()
        uses: actions/upload-artifact@v6
        with:
          name: tapyrus-windows-${{ matrix.config.target_arch }}-binaries-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/build/bin/*.exe
            ${{ github.workspace }}/build/bin/*.dll
          retention-days: 30

      - name: Debug Core Dump (if exists)
        if: failure() && matrix.config.target_platform != 'windows'
        run: |
          # Scan the directory configured via core_pattern/kern.corefile in
          # "Enable core dumps" directly, on both platforms -- coredumpctl
          # (systemd-coredump's own index) never sees these dumps, since
          # core_pattern was pointed at a plain file path instead of the
          # systemd-coredump pipe.
          CORE_DUMP_DIR="${{ github.workspace }}/core_dumps"
          shopt -s nullglob
          COREFILES=("$CORE_DUMP_DIR"/core.*)
          if [ ${#COREFILES[@]} -eq 0 ]; then
            echo "No core dumps found in $CORE_DUMP_DIR"
            exit 0
          fi

          {
            echo "## Core Dump Backtraces — ${{ matrix.config.name }}"
          } >> "$GITHUB_STEP_SUMMARY"

          for COREFILE in "${COREFILES[@]}"; do
            echo "Found core dump: $COREFILE"

            # `file` embeds the crashing binary's path, but it may be relative
            # to wherever it was invoked from (e.g. "./test_tapyrus" run from
            # $BASE_BUILD_DIR/bin) rather than this step's cwd ($GITHUB_WORKSPACE).
            BINARY_RAW=$(file "$COREFILE" | awk -F"'" '{print $2}')
            if [ -x "$BINARY_RAW" ]; then
              BINARY="$BINARY_RAW"
            elif [ -x "$BASE_BUILD_DIR/bin/$(basename "$BINARY_RAW" 2>/dev/null)" ]; then
              BINARY="$BASE_BUILD_DIR/bin/$(basename "$BINARY_RAW")"
            else
              echo "Could not detect crashed binary, using tapyrusd as default"
              BINARY="$BASE_BUILD_DIR/bin/tapyrusd"
            fi
            echo "Using binary: $BINARY"

            {
              echo ""
              echo "### $(basename "$COREFILE") ($BINARY)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "${{ matrix.config.platform }}" == "linux" ]; then
              gdb -batch -ex "bt full" -ex "quit" "$BINARY" "$COREFILE" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            else
              lldb -c "$COREFILE" -o "bt" -o "quit" -- "$BINARY" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            fi

            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload Core Dumps
        if: failure() && matrix.config.target_platform != 'windows'
        uses: actions/upload-artifact@v6
        with:
          name: daily-core-dumps-${{ matrix.config.name }}-${{ github.run_id }}
          path: ${{ github.workspace }}/core_dumps/
          retention-days: 7

  # fuzz-code-only: runs each libFuzzer target in src/test/fuzz/fuzz_code/
  # under ASan/UBSan for an equal share of FUZZ_TOTAL_SECONDS, seeded from a
  # rotating slice of its seed pool, to find crashes. Uploads crash inputs and
  # new corpus entries not yet in the pool, for review.
  fuzz-code-only:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Fuzzing time is a fixed total split across targets, so adding targets
    # shortens each one's run instead of outgrowing this timeout. The margin
    # covers checkout, build and artifact upload.
    timeout-minutes: 105
    env:
      LC_ALL: C.UTF-8
      FUZZ_TOTAL_SECONDS: ${{ inputs.fuzz_total_seconds || '4200' }}
      SLICE_BATCH_SIZE: ${{ inputs.fuzz_slice_batch_size || '5' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.test_branch || github.ref || 'master' }}
          submodules: recursive
      - name: Install build dependencies
        timeout-minutes: 10
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y cmake libboost-dev libevent-dev libdb++-dev clang
      - name: Configure with libFuzzer + ASan/UBSan
        run: >
          cmake -S . -B build_fuzz
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DSANITIZERS="fuzzer,address,undefined"
          -DBUILD_DAEMON=OFF -DBUILD_GUI=OFF -DBUILD_CLI=OFF
          -DBUILD_GENESIS=OFF -DBUILD_SCRIPT_VERIFY=OFF
          -DENABLE_WALLET=OFF -DENABLE_TESTS=ON -DENABLE_BENCH=OFF
          -DBUILD_FUZZ_TEST=ON
      # src/test/CMakeLists.txt globs every fuzz/fuzz_code/*_fuzz.cpp file into its
      # own executable
      - name: Build fuzz targets
        run: cmake --build build_fuzz --target fuzz_all -j "$(nproc)"
      - name: Run each target, seeded from this run's rotating pool slice
        run: |
          mkdir -p fuzz_artifacts new_seed_candidates
          targets=(build_fuzz/bin/fuzz_*)
          RUN_SECONDS=$(( FUZZ_TOTAL_SECONDS / ${#targets[@]} ))
          echo "Fuzzing ${#targets[@]} targets for ${RUN_SECONDS}s each."
          for target_path in "${targets[@]}"; do
            target=$(basename "${target_path}")
            pool_dir="src/test/fuzz/fuzz_seed_pool/${target}"
            corpus_dir="fuzz_corpus/${target}"
            mkdir -p "${pool_dir}" "${corpus_dir}"

            python3 src/test/fuzz/fuzz_seed_pool/fuzz_code_select_slice.py \
              "${pool_dir}" "${SLICE_BATCH_SIZE}" "${{ github.run_number }}" \
              --out "${corpus_dir}" 2> >(tee "slice_${target}.log" >&2) || true
            if grep -q '^POOL_EMPTY=1$' "slice_${target}.log"; then
              echo "::warning::${pool_dir} is empty -- ${target} is running with no seed pool this run. Seed it (e.g. from a longer local -max_total_time run) and commit the results."
            fi
            if grep -q '^CYCLE_COMPLETE=1$' "slice_${target}.log"; then
              echo "::notice::${pool_dir} completed a full rotation cycle this run."
            fi

            timeout "${RUN_SECONDS}" \
              ./build_fuzz/bin/"${target}" \
                -artifact_prefix=fuzz_artifacts/"${target}"- \
                -max_total_time="${RUN_SECONDS}" \
                "${corpus_dir}" \
              || test $? -eq 124  # timeout's own "ran to the limit" exit code -- not a failure

            # Keep only corpus entries not already in the seed pool, as new
            # seed candidates for review.
            new_dir="new_seed_candidates/${target}"
            mkdir -p "${new_dir}"
            comm -23 <(ls "${corpus_dir}" | sort) <(ls "${pool_dir}" 2>/dev/null | sort) \
              | while read -r f; do cp "${corpus_dir}/${f}" "${new_dir}/"; done
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: daily-fuzz-run-artifacts-${{ github.run_id }}
          path: |
            fuzz_artifacts/
            new_seed_candidates/

  # fuzz-script-sweep: runs the committed Script program pool
  # (src/test/fuzz/fuzz_scripts, grown per contrib/fuzz/fuzz_script/README.md)
  # through tapyrus-verify --fuzz under ASan/UBSan to find interpreter crashes.
  # Each run starts at a different offset and stops at the time budget.
  # Uploads the programs it tested, for reproducing a crash.
  fuzz-script-sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Sweep time budget plus margin for checkout/build/artifact-upload --
    # not itself the sweep's own time limit, which is
    # SWEEP_TIME_BUDGET_SECONDS below; this is only a backstop against
    # the job hanging entirely.
    timeout-minutes: 50
    env:
      LC_ALL: C.UTF-8
      SWEEP_TIME_BUDGET_SECONDS: ${{ inputs.sweep_time_budget_seconds || '1800' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.test_branch || github.ref || 'master' }}
          submodules: recursive
      - name: Install build dependencies
        timeout-minutes: 10
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y cmake libboost-dev clang
      - name: Configure tapyrus-verify with ASan/UBSan
        run: >
          cmake -S . -B build_fuzz_verify
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DSANITIZERS="address,undefined"
          -DBUILD_DAEMON=OFF -DBUILD_GUI=OFF -DBUILD_CLI=OFF -DBUILD_GENESIS=OFF
          -DENABLE_WALLET=OFF -DENABLE_TESTS=OFF -DENABLE_BENCH=OFF -DENABLE_ZMQ=OFF
          -DBUILD_SCRIPT_VERIFY=ON -DBUILD_FUZZ_TEST=ON
      - name: Build tapyrus-verify
        run: cmake --build build_fuzz_verify --target tapyrus-verify -j "$(nproc)"
      - name: Sweep a rotating window of the pool for up to the time budget
        run: |
          pool_dir="src/test/fuzz/fuzz_scripts"
          mkdir -p "${pool_dir}" swept_inputs
          mapfile -t all_files < <(find "${pool_dir}" -maxdepth 1 -type f ! -name "README.md" | sort)
          pool_size=${#all_files[@]}
          if [ "${pool_size}" -eq 0 ]; then
            echo "::warning::${pool_dir} is empty -- grow it locally per contrib/fuzz/fuzz_script/README.md and commit the result first."
            exit 0
          fi

          offset=$(( ${{ github.run_number }} % pool_size ))
          deadline=$(( $(date +%s) + SWEEP_TIME_BUDGET_SECONDS ))
          # Exit code 2 means ParseScript rejected the candidate as not
          # valid Script -- ordinary LLM noise (see tapyrus-verify.cpp's
          # own exit-code contract), expected occasionally and never a
          # reason to fail this job. Anything else nonzero (including a
          # signal-killed process from an ASan/UBSan abort) is a real
          # finding.
          fail=0
          tested=0
          i="${offset}"
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            f="${all_files[$i]}"
            cp "$f" swept_inputs/
            rc=0
            ./build_fuzz_verify/bin/tapyrus-verify --fuzz "$f" || rc=$?
            if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 2 ]; then
              fail=1
            fi
            tested=$((tested + 1))
            i=$(( (i + 1) % pool_size ))
            if [ "${i}" -eq "${offset}" ]; then
              echo "Completed a full lap of the pool (${pool_size} candidates) before the time budget ran out."
              break
            fi
          done
          echo "Tested ${tested} of ${pool_size} pool candidates this run (started at offset ${offset})."
          exit "${fail}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fuzz-script-sweep-artifacts-${{ github.run_id }}
          path: swept_inputs/
          if-no-files-found: ignore